<script>
// 1. Ladataan tallennettu ostoskori heti kun sivu latautuu
function loadSavedCart() {
    const saved = localStorage.getItem("currentCart");
    if(saved) {
        cart = JSON.parse(saved);
        renderCart();
        render(); // Päivittää myös tuotelistan numerot
    }
}

// 2. Tallennetaan ostoskori aina kun sitä muutetaan
function updateQty(code, name, delta, skipRelated = false) {
    if(!cart[code]) {
        if(!name) { for(let c in allData) { let p = allData[c].find(x => x.code === code); if(p) name = p.name; } }
        cart[code] = { code, name: name || "Tuote " + code, qty: 0 };
    }
    if(delta > 0 && relatedItems[code] && !skipRelated) openRelatedPopup(code);
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    
    // TALLENNUS LOCALSTORAGEEN
    localStorage.setItem("currentCart", JSON.stringify(cart));
    
    let el = document.getElementById("q_"+code); if(el) el.value = cart[code]?.qty || 0;
    renderCart();
}

// 3. Päivitetty finalSubmit vahvistusviestillä (CC-kenttä)
function finalSubmit() {
    const f = { 
        t: document.getElementById("f_tilaaja").value, 
        v: document.getElementById("f_varasto").value, 
        p: document.getElementById("f_pvm").value, 
        tapa: document.getElementById("f_tapa").value, 
        o: document.getElementById("f_osoite").value, 
        n: document.getElementById("f_postinro").value, 
        k: document.getElementById("f_paikka").value 
    };
    
    if(!f.t || !f.v || !f.p || !f.tapa || !f.o || !f.n || !f.k) return alert("Täytä kaikki tiedot!");

    const subject = `Varaosatilaus - ${f.t} - ${f.v}`;
    const confirmSubject = `Varaosatilaus - ${f.p}`; // Vahvistusviestin otsikko-osa (jos käytettäisiin erillistä)

    let body = `Tilaaja: ${f.t}\nVarastonumero: ${f.v}\nPäivämäärä: ${f.p}\nToimitustapa: ${f.tapa}\nOsoite: ${f.o}, ${f.n} ${f.k}\n\n`;
    body += `LISÄTIEDOT: ${document.getElementById("f_lisatiedot").value}\n`;
    body += `MUUT TUOTTEET: ${document.getElementById("f_vapaat").value}\n\n`;
    body += `TUOTTEET:\n`;
    
    Object.values(cart).forEach(i => {
        body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`;
    });

    // Tyhjennetään ostoskori tilauksen jälkeen
    localStorage.removeItem("currentCart");
    cart = {};
    renderCart();
    render();

    // Avaa sähköposti. Lisätty CC, jotta tilaaja saa kopion itselleen.
    // HUOM: Mailto ei tue useita eri bodyja, joten CC on paras tapa varmistaa että sama viesti menee molemmille.
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=${encodeURIComponent(subject)}&cc=${encodeURIComponent('oma.sahkoposti@hartwall.fi')}&body=${encodeURIComponent(body)}`;
}

// Muista kutsua loadSavedCart() doAppLogin-funktiossa!
function doAppLogin() {
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadLocalStock(); 
        loadSavedCart(); // Lisätty tämä
        loadFiles();
    } else { alert("Virhe!"); }
}
</script>
