<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --hw-gold:#fbc02d; --sidebar-w: 280px; }
body { font-family:'Inter', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* LOGIN & MODALS */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
.login-box { text-align: center; background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 320px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; box-sizing: border-box; }
#pkgModal, #imgModal, #fullCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; }

.app-container { display: flex; min-height: 100vh; }
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease; z-index: 22000; }
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 22000; }
.nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; text-align: center; position: relative; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* KATEGORIAKORTIT (Ylä) */
.category-card { background: white; border-radius: 12px; border: 1px solid #e1e4e8; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.category-card:hover { transform: translateY(-5px); border-color: var(--hw-blue); }
.category-card img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 10px; }
.category-card span { font-weight: 700; color: var(--hw-blue); text-transform: uppercase; font-size: 13px; }

/* ALAKATEGORIA-NAPIT (Quick links) */
.sub-nav-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0 20px 0; margin-bottom: 20px; border-bottom: 1px solid #eee; scrollbar-width: none; }
.sub-nav-container::-webkit-scrollbar { display: none; }
.sub-nav-item { flex-shrink: 0; width: 90px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.sub-nav-img { width: 60px; height: 60px; border-radius: 50%; background: white; border: 2px solid #ddd; object-fit: contain; padding: 5px; transition: border-color 0.2s; }
.sub-nav-item:hover .sub-nav-img { border-color: var(--hw-blue); }
.sub-nav-text { font-size: 10px; font-weight: 600; color: #555; text-transform: uppercase; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* TUOTEKORTIT */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 10px 0; }
.product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; position: relative; }
.product-card.in-cart { border: 2px solid var(--hw-green); background: #f0fff4; }
.thumb-img { width: 100px; height: 100px; object-fit: contain; cursor: zoom-in; margin-bottom: 10px; }

.category-title { grid-column: 1 / -1; background: #e9ecef; color: var(--hw-blue); padding: 12px 15px; margin-top: 40px; margin-bottom: 15px; border-radius: 8px; font-size: 15px; font-weight: 800; text-transform: uppercase; border-left: 5px solid var(--hw-blue); scroll-margin-top: 80px; }

.qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; }
.qty-btn { width: 32px; height: 32px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 18px; }
.qty-input { width: 45px; text-align: center; border: 1px solid #cbd5e0; padding: 5px; font-weight: bold; border-radius: 6px; }

.search-container { position: relative; margin-bottom: 20px; }
#filter { width: 100%; padding: 14px 20px; font-size: 15px; border: 2px solid var(--hw-blue); border-radius: 50px; box-sizing: border-box; }

.form-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 20px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.form-grid input, .form-grid select, .form-grid textarea { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; width: 100%; box-sizing: border-box; font-family: inherit; }

#btnTop { position: fixed; bottom: 30px; right: 300px; background: var(--hw-blue); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; display: none; z-index: 9999; cursor: pointer; font-weight: bold; }

@media (max-width: 900px) {
    .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); width: 85%; z-index: 22000; }
    .nav-sidebar.open { transform: translateX(0); }
    .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); width: 100%; }
    .cart-sidebar.open { transform: translateX(0); }
    #btnTop { right: 20px; }
}

.modal-content { background:white; padding:30px; border-radius:16px; width:750px; max-width:95%; max-height:85vh; overflow-y:auto; position: relative; }
.close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }
</style>
</head>
<body>

<div id="toastContainer" class="toast-container" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:1000000;"></div>

<div id="loginOverlay">
    <div class="login-box">
        <img src="392px-Hartwallin_logo.svg.png" alt="Hartwall Logo" style="width: 100%; max-width: 240px; margin-bottom: 25px;">
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-dark); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar" style="display:flex; background:var(--hw-dark); padding:10px; gap:10px; position:sticky; top:0; z-index:16000;">
        <button class="mobile-btn" style="flex:1; padding:10px; background:var(--hw-blue); color:white; border:none; border-radius:6px; font-weight:bold;" onclick="toggleSidebar('nav-sidebar')">VALIKKO</button>
        <button class="mobile-btn" style="flex:1; padding:10px; background:var(--hw-blue); color:white; border:none; border-radius:6px; font-weight:bold;" onclick="toggleSidebar('cart-sidebar')">KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">
                <img src="392px-Hartwallin_logo.svg.png" style="width:130px; filter: brightness(0) invert(1);"><br>VARAOSAT
            </div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section">
                <div class="form-grid">
                    <input id="f_tilaaja" placeholder="Tilaaja *" required>
                    <input id="f_varasto" placeholder="Varastonumero *" required>
                    <input id="f_pvm" type="date" required>
                    <select id="f_tapa">
                        <option value="Oma logistiikka">Oma logistiikka (ensisijaisesti)</option>
                        <option value="Kaukokiito">Kaukokiito</option>
                        <option value="Posti">Posti</option>
                    </select>
                    <input id="f_osoite" placeholder="Osoite *" required>
                    <input id="f_postinro" placeholder="Postinumero *" required>
                    <input id="f_paikka" placeholder="Paikkakunta *" required>
                    <textarea id="f_lisatiedot" placeholder="Lisätietoja..." style="grid-column:1/-1; height:50px;"></textarea>
                    <textarea id="f_puuttuvat" placeholder="Listalta puuttuvat tuotteet..." style="grid-column:1/-1; height:50px; color:#666;"></textarea>
                </div>
            </div>

            <div class="info-box"><span class="info-icon">🚚</span><div><strong>Toimitusaika:</strong> 8 työpäivää.</div></div>

            <div class="search-container">
                <input id="filter" placeholder="Hae tuotteita..." oninput="handleSearch(this.value)">
            </div>

            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div style="background:var(--hw-green); color:white; padding:20px; text-align:center; font-weight:bold;">OSTOSKORI (<span id="basket-count">0</span>)</div>
            <div id="basket-items" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="openFullCart()" style="width:100%; padding:14px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
            </div>
        </aside>
    </div>
</div>

<div id="fullCartModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('fullCartModal').style.display='none'">&times;</span><h2>Tilausyhteenveto</h2><div id="fullCartInfo"></div><div id="fullCartItems"></div><button onclick="finalSubmit()" style="width:100%; padding:20px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; margin-top:20px; cursor:pointer;">VAHVISTA JA LÄHETÄ</button></div></div>
<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span><h3 id="imgModalTitle"></h3><img id="bigImg" style="width:100%; max-height:50vh; object-fit:contain;"></div></div>

<button onclick="window.scrollTo({top:0, behavior:'smooth'})" id="btnTop">↑</button>

<script>
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; 
let currentCategoryFilter = null;

function toggleSidebar(id) { document.getElementById(id).classList.toggle('open'); }

async function doAppLogin() {
    const res = await fetch("käyttäjät.txt");
    if(res.ok) {
        const t = await res.text();
        const u = document.getElementById("uField").value.trim().toLowerCase();
        const p = document.getElementById("pField").value.trim();
        let ok = false;
        t.split("\n").forEach(line => {
            const parts = line.trim().split(/\s+/);
            if(parts[0].toLowerCase() === u && parts[1] === p) ok = true;
        });
        if(ok) {
            document.getElementById("loginOverlay").style.display="none";
            document.getElementById("appWrapper").style.display="block";
            document.getElementById("f_pvm").valueAsDate = new Date();
            loadAllData();
        } else alert("Virhe!");
    }
}

async function loadAllData() {
    const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
    if(r1.ok) {
        const t = await r1.text(); let cur = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            if(s.startsWith("*")) { cur = s.substring(1).trim(); allData[cur] = []; } 
            else if(cur) {
                const p = s.split(/\s+/);
                allData[cur].push({code: p[0], name: s.substring(p[0].length).trim()});
            }
        });
    }
    if(r2.ok) {
        const t = await r2.text(); let curM = null;
        t.split("\n").forEach(l => {
            let s = l.trim(); if(!s) return;
            if(!l.startsWith("-")) { curM = {name: s, subs: []}; categories.push(curM); } 
            else { if(curM) curM.subs.push(s.substring(1).trim()); }
        });
    }
    renderNav(); render();
}

function renderCategoryCards() {
    const list = document.getElementById("main-list");
    list.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 10px;">
            ${categories.map(c => `
                <div class="category-card" onclick="selectCategory('${c.name.replace(/'/g, "\\'")}')">
                    <img src="KATEGORIAKUVATYLÄ/${encodeURIComponent(c.name)}.png" onerror="this.style.display='none'">
                    <span>${c.name}</span>
                </div>
            `).join('')}
        </div>
    `;
}

function selectCategory(catName) {
    currentCategoryFilter = catName;
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

async function render(filter = "") {
    const list = document.getElementById("main-list");
    if (!filter && !currentCategoryFilter) { renderCategoryCards(); return; }

    list.innerHTML = "";
    if (currentCategoryFilter && !filter) {
        // TAKAISIN-NAPPI JA ALAKATEGORIA-NAPIT
        const catObj = categories.find(c => c.name === currentCategoryFilter);
        let subNavHtml = `<button onclick="currentCategoryFilter=null;render();" style="margin-bottom:20px; padding:12px; background:#eee; border:1px solid #ccc; border-radius:8px; cursor:pointer; font-weight:bold; color:var(--hw-blue);">← TAKAISIN</button>`;
        
        subNavHtml += `<div class="sub-nav-container">`;
        catObj.subs.forEach(sub => {
            const subId = "cat-" + sub.replace(/\s+/g, '-').toLowerCase();
            subNavHtml += `
                <div class="sub-nav-item" onclick="document.getElementById('${subId}').scrollIntoView({behavior:'smooth'})">
                    <img class="sub-nav-img" src="ALAKATEGORIAKUVAT/${encodeURIComponent(sub)}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                    <div class="sub-nav-text">${sub}</div>
                </div>`;
        });
        subNavHtml += `</div>`;
        list.innerHTML = subNavHtml;
    }

    for (const c of categories) {
        if (currentCategoryFilter && c.name !== currentCategoryFilter) continue;
        for (const sub of c.subs) {
            let prods = allData[sub.trim()] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) continue;
            
            let title = document.createElement("div");
            title.className = "category-title"; title.innerText = sub;
            title.id = "cat-" + sub.replace(/\s+/g, '-').toLowerCase();
            list.appendChild(title);
            
            let grid = document.createElement("div"); grid.className = "product-grid";
            for (const p of filt) {
                let inCartClass = cart[p.code] ? 'in-cart' : '';
                grid.innerHTML += `
                    <div class="product-card ${inCartClass}">
                        <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}','${p.name.replace(/'/g, "\\'")}')">
                        <div style="font-weight:bold; font-size:12px; height:32px; overflow:hidden;">${p.name}</div>
                        <div style="font-size:10px; color:#666;">${p.code}</div>
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g, "\\'")}',-1)">-</button>
                            <input type="number" class="qty-input" value="${cart[p.code]?.qty || 0}" onchange="setQty('${p.code}','${p.name.replace(/'/g, "\\'")}',this.value)">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g, "\\'")}',1)">+</button>
                        </div>
                    </div>`;
            }
            list.appendChild(grid);
        }
    }
}

function handleSearch(val) { currentCategoryFilter = null; render(val); }
function resetSearch() { document.getElementById("filter").value = ""; handleSearch(""); }

function finalSubmit() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value, o: document.getElementById("f_osoite").value, p: document.getElementById("f_postinro").value, k: document.getElementById("f_paikka").value };
    if(!f.t || !f.v || !f.o) return alert("Täytä tähdellä merkityt!");
    let subject = `Tilaus - ${f.t} - ${f.v}`;
    let body = `Tilaaja: ${f.t}\nVarasto: ${f.v}\nOsoite: ${f.o}, ${f.p} ${f.k}\n\nTuotteet:\n`;
    Object.values(cart).forEach(i => { body += `${i.qty} kpl : ${i.code} - ${i.name}\n`; });
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function updateQty(c, n, d) { let q = (cart[c]?.qty || 0) + d; setQty(c, n, q); }
function setQty(c, n, v) {
    let num = parseInt(v) || 0;
    if(num <= 0) delete cart[c]; else cart[c] = {code:c, name:n, qty:num};
    renderCart(); render(document.getElementById("filter").value);
}
function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    Object.values(cart).forEach(i => { div.innerHTML += `<div style="padding:5px; border-bottom:1px solid #eee;">${i.qty} x ${i.code}</div>`; });
    const count = Object.keys(cart).length;
    document.getElementById("basket-count").innerText = count;
    document.getElementById("m-count").innerText = count;
}

function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let main = document.createElement("div");
        main.className = "nav-main-cat"; main.style="padding:12px; cursor:pointer; font-weight:bold; border-bottom:1px solid #eee;";
        main.innerText = c.name;
        main.onclick = () => { selectCategory(c.name); if(window.innerWidth<900) toggleSidebar('nav-sidebar'); };
        nav.appendChild(main);
    });
}

function openFullCart() {
    const items = document.getElementById("fullCartItems"); items.innerHTML = "";
    Object.values(cart).forEach(i => { items.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">${i.qty} kpl - ${i.code} - ${i.name}</div>`; });
    document.getElementById("fullCartModal").style.display = "flex";
}
async function openBigImg(code, name) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = name;
    document.getElementById("imgModal").style.display = "flex";
}
</script>
</body>
</html>
