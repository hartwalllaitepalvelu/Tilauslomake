<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus Pro</title>
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --sidebar-w: 280px; }
body { font-family:'Segoe UI', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* MODALS & OVERLAYS */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#pkgModal, #imgModal, #relatedOverlay, #viewCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; }

.app-container { display: flex; min-height: 100vh; }

/* NAV SIDEBAR */
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s; z-index: 15000; }
.nav-header { background: var(--hw-dark); color: white; padding: 20px; font-weight: bold; font-size: 16px; }
.nav-item { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
.nav-sub-list { display: none; background: #fafafa; padding-bottom: 10px; }
.nav-item.active .nav-sub-list { display: block; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* MOBIILIPALKKI */
.mobile-top-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 10001; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.mobile-btn { flex: 1; padding: 10px; background: var(--hw-blue); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }

/* ASENNUSPAKETIT */
.pkg-section { background:#fff9c4; padding:15px; border-radius:12px; border:2px solid #fbc02d; margin-bottom:25px; }
.pkg-grid { display:flex; gap:10px; flex-wrap:wrap; }
.pkg-btn { padding:10px 15px; background:var(--hw-blue); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size: 12px; }

/* GRID & KORTIT */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 10px 0; }
.product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; position: relative; }
.product-card.out { opacity: 0.6; background: #f9f9f9; }
.thumb-img { width: 100px; height: 100px; object-fit: contain; background: white; cursor: zoom-in; margin-bottom: 10px; }

.qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; width: 100%; justify-content: center; }
.qty-btn { width: 32px; height: 32px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 18px; }
.qty-input { width: 35px; text-align: center; border: 1px solid #cbd5e0; padding: 5px; font-weight: bold; border-radius: 6px; }

.category-title { background: var(--hw-blue); color: white; padding: 10px 15px; margin: 25px 0 10px 0; border-radius: 8px; font-weight: bold; width: 100%; box-sizing: border-box; }

/* OSTOSKORI SIVUSTA */
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s; z-index: 15000; }
.cart-header { background: var(--hw-green); color: white; padding: 20px; text-align: center; font-weight: bold; }
.cart-item-list { flex: 1; overflow-y: auto; padding: 10px; }

/* YLÖS-NAPPI */
#btnTop { position: fixed; bottom: 25px; right: 25px; background: var(--hw-blue); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; display: none; z-index: 9999; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 20px; }

@media (max-width: 900px) {
    .mobile-top-bar { display: flex; }
    .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); }
    .nav-sidebar.open { transform: translateX(0); }
    .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); }
    .cart-sidebar.open { transform: translateX(0); }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .main-content { padding: 15px; }
}

.modal-content { background:white; padding:30px; border-radius:16px; width:600px; max-width:90%; max-height:80vh; overflow-y:auto; position: relative; }
.close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }
</style>
</head>
<body>

<div id="loginOverlay"><div class="login-box"><h2>Hartwall Varaosat</h2><input id="uField" placeholder="Käyttäjätunnus"><input id="pField" type="password" placeholder="Salasana"><button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button></div></div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar">
        <button class="mobile-btn" onclick="toggleMenu('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleMenu('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">TUOTERYHMÄT <span onclick="toggleMenu('nav-sidebar')" style="float:right; cursor:pointer;" class="close-mob">✕</span></div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section">
                <div class="form-grid"><input id="f_tilaaja" placeholder="Tilaaja"><input id="f_varasto" placeholder="Varasto"><input id="f_pvm" type="date"></div>
            </div>

            <div class="pkg-section">
                <div style="font-weight:bold; margin-bottom:10px; color:var(--hw-blue);">VALMIIT ASENNUSPAKETIT</div>
                <div id="pkg-buttons" class="pkg-grid"></div>
            </div>

            <div style="margin-bottom:20px;">
                <input id="filter" style="width:100%; padding:12px 20px; font-size:15px; border:2px solid var(--hw-blue); border-radius:50px; box-sizing:border-box;" placeholder="Hae tuotteita..." oninput="render(this.value)">
            </div>

            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div class="cart-header">OSTOSKORI (<span id="basket-count">0</span>) <span onclick="toggleMenu('cart-sidebar')" style="float:right; cursor:pointer;">✕</span></div>
            <div id="basket-items" class="cart-item-list"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="finalSubmit()" style="width:100%; padding:12px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
            </div>
        </aside>
    </div>
</div>

<div id="pkgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('pkgModal').style.display='none'">&times;</span><h3 id="pkgModalTitle"></h3><div id="pkgModalItems"></div><button onclick="confirmPkgToCart()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:10px; font-weight:bold; margin-top:15px;">LISÄÄ KORIIN</button></div></div>
<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span><h3 id="imgModalTitle"></h3><img id="bigImg" style="width:100%; max-height:60vh; object-fit:contain;"></div></div>

<button onclick="window.scrollTo({top:0, behavior:'smooth'})" id="btnTop">↑</button>

<script>
const asennusPaketit = {
    "Kotipizza": [{code:"15490",qty:1},{code:"26520",qty:1},{code:"V00713",qty:5},{code:"V00726",qty:2},{code:"V02356",qty:1}],
    "Subway": [{code:"15279",qty:1},{code:"10160",qty:1},{code:"V00713",qty:4}],
    "LD HIGHTOWER": [{code:"19814",qty:1},{code:"30105",qty:1},{code:"V02013",qty:3}]
};
const sallitut = {"tomppa":"Tomi7122","markku":"parkinson","jaakko":"vendingjaska","dan":"huoltodan","tommi":"nappie","samia":"koksmeny","bob":"nayri","jouni":"paju1","jussi":"paukku","sami":"ruoska","jurni":"kurnu"};
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; let currentPkgItems = [];

window.onscroll = () => { document.getElementById("btnTop").style.display = window.scrollY > 300 ? "block" : "none"; };

function doAppLogin() {
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadStockStatus();
        loadFiles();
    } else { alert("Kirjautuminen epäonnistui!"); }
}

async function loadStockStatus() {
    try {
        const res = await fetch("varastotilanne.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const parts = line.trim().split(";");
                if(parts.length >= 4) stockStatus[parts[0]] = { outOfStock: parts[1] === "true", hidden: parts[2] === "true", eta: parts[3] };
            });
            render();
        }
    } catch(e) {}
}

async function loadFiles() {
    const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
    if(r1.ok) {
        const t = await r1.text(); let cur = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            if(!/\d/.test(s.split(" ")[0])) { cur = s; allData[cur] = []; }
            else if(cur) { allData[cur].push({code: s.split(" ")[0], name: s.substring(s.split(" ")[0].length).trim()}); }
        });
    }
    if(r2.ok) {
        const t = await r2.text(); let curM = null;
        t.split("\n").forEach(l => {
            let s = l.trim(); if(!s) return;
            if(l.startsWith("-")) { if(curM) curM.subs.push(s.substring(1)); }
            else { curM = {name: s, subs: []}; categories.push(curM); }
        });
    }
    renderNav(); renderPkgs(); render();
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) return;
            let title = document.createElement("div"); title.className = "category-title"; title.innerText = sub; title.id = "cat-" + sub.replace(/\s+/g, '-').toLowerCase();
            list.appendChild(title);
            let grid = document.createElement("div"); grid.className = "product-grid";
            filt.forEach(p => {
                let s = stockStatus[p.code] || {}; if (s.hidden) return;
                grid.innerHTML += `
                    <div class="product-card ${s.outOfStock ? 'out' : ''}">
                        <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}')">
                        <div class="card-title">${p.name}</div>
                        <div class="card-code">${p.code}</div>
                        ${s.outOfStock ? `<div style="color:red; font-size:10px; font-weight:bold;">LOPPU! ${s.eta ? 'ETA: '+s.eta : ''}</div>` : ''}
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',-1)">-</button>
                            <input class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" readonly>
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',1)">+</button>
                        </div>
                    </div>`;
            });
            list.appendChild(grid);
        });
    });
}

function updateQty(code, name, delta) {
    if(!cart[code]) cart[code] = { code, name, qty: 0 };
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    let el = document.getElementById("q_"+code); if(el) el.value = cart[code]?.qty || 0;
    renderCart();
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    Object.values(cart).forEach(i => { div.innerHTML += `<div class="cart-item"><b>${i.code}</b><br>${i.name}<br>Määrä: ${i.qty}</div>`; });
    const count = Object.values(cart).length;
    document.getElementById("basket-count").innerText = count;
    document.getElementById("m-count").innerText = count;
}

function renderPkgs() {
    const div = document.getElementById("pkg-buttons"); div.innerHTML = "";
    Object.keys(asennusPaketit).forEach(name => {
        div.innerHTML += `<button class="pkg-btn" onclick="openPkgModal('${name}')">${name}</button>`;
    });
}

function openPkgModal(name) {
    const items = document.getElementById("pkgModalItems"); items.innerHTML = "";
    document.getElementById("pkgModalTitle").innerText = name;
    currentPkgItems = JSON.parse(JSON.stringify(asennusPaketit[name]));
    currentPkgItems.forEach((item, idx) => {
        let n = "Tuote " + item.code;
        for(let c in allData) { let f = allData[c].find(x => x.code === item.code); if(f) n = f.name; }
        items.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">${n} (${item.code}) - ${item.qty} kpl</div>`;
    });
    document.getElementById("pkgModal").style.display = "flex";
}

function confirmPkgToCart() {
    currentPkgItems.forEach(i => {
        let n = "Tuote " + i.code;
        for(let c in allData) { let f = allData[c].find(x => x.code === i.code); if(f) n = f.name; }
        updateQty(i.code, n, i.qty);
    });
    document.getElementById("pkgModal").style.display = "none";
}

function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let div = document.createElement("div"); div.className = "nav-item";
        div.innerHTML = `<div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} <span>▾</span></div>`;
        let subDiv = document.createElement("div"); subDiv.className = "nav-sub-list";
        c.subs.forEach(s => { 
            let item = document.createElement("div"); item.style = "padding:10px 30px; cursor:pointer;"; item.innerText = s; item.onclick = () => {
                const safeId = "cat-" + s.replace(/\s+/g, '-').toLowerCase();
                const el = document.getElementById(safeId);
                if(el) el.scrollIntoView({behavior:"smooth", block: "start"});
                toggleMenu('nav-sidebar');
            }; subDiv.appendChild(item);
        });
        div.appendChild(subDiv); nav.appendChild(div);
    });
}

function toggleMenu(id) { document.getElementById(id).classList.toggle('open'); }
async function openBigImg(code) { document.getElementById("bigImg").src = `images/${code}.png`; document.getElementById("imgModalTitle").innerText = code; document.getElementById("imgModal").style.display = "flex"; }
function finalSubmit() { window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus&body=Tilaaja: ${document.getElementById("f_tilaaja").value}`; }
</script>

</body>
</html>
