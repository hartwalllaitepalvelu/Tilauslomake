<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --hw-gold:#fbc02d; --sidebar-w: 280px; }
body { font-family:'Inter', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* MODAL & LOGIN STYLES */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
.login-box { text-align: center; background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 320px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; box-sizing: border-box; }

#pkgModal, #imgModal, #fullCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200000; justify-content:center; align-items:center; }

.modal-content { background:white; padding:30px; border-radius:16px; width:750px; max-width:95%; max-height:85vh; overflow-y:auto; position: relative; color: #333; }
.close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }

.app-container { display: flex; min-height: 100vh; }

/* SIDEBARS */
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease; z-index: 22000; }
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 22000; }

.nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; font-size: 14px; text-align: center; position: relative; }
.nav-group { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 12px 15px; font-weight: 700; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.nav-sub-list { display: none; background: white; }
.nav-group.active .nav-sub-list { display: block; }
.nav-sub-item { padding: 10px 15px 10px 30px; cursor: pointer; border-bottom: 1px solid #f9f9f9; color: #555; font-size: 13px; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* MOBILE TOP BAR */
.mobile-top-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 16000; gap: 10px; }
.mobile-btn { flex: 1; padding: 10px; background: var(--hw-blue); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-weight: bold; cursor: pointer; }

/* PRODUCT GRID */
.category-title { grid-column: 1 / -1; background: #e9ecef; color: var(--hw-blue); padding: 12px 15px; margin-top: 50px; margin-bottom: 15px; border-radius: 8px; font-size: 16px; font-weight: 800; text-transform: uppercase; border-left: 5px solid var(--hw-blue); scroll-margin-top: 100px; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 10px 0; }
.product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; transition: all 0.2s; position: relative; }
.product-card.in-cart { border: 2px solid var(--hw-green); background: #f0fff4; }
.thumb-img { width: 100px; height: 100px; object-fit: contain; cursor: zoom-in; margin-bottom: 10px; }

.qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; }
.qty-btn { width: 32px; height: 32px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 18px; }
.qty-input { width: 50px; text-align: center; border: 1px solid #cbd5e0; padding: 5px; font-weight: bold; border-radius: 6px; }

/* SEARCH */
.search-container { position: relative; margin-bottom: 20px; }
#filter { width: 100%; padding: 14px 20px; font-size: 15px; border: 2px solid var(--hw-blue); border-radius: 50px; box-sizing: border-box; outline: none; }

@media (max-width: 900px) {
    .mobile-top-bar { display: flex; }
    .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); width: 85%; z-index: 200000; }
    .nav-sidebar.open { transform: translateX(0); }
    .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); width: 100%; z-index: 200000; }
    .cart-sidebar.open { transform: translateX(0); }
}
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <img src="392px-Hartwallin_logo.svg.png" alt="Logo" style="width: 100%; max-width: 240px; margin-bottom: 25px;">
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-dark); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar">
        <button class="mobile-btn" onclick="toggleSidebar('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleSidebar('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">VARAOSAT</div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="search-container">
                <input id="filter" placeholder="Hae tuotteita..." oninput="render(this.value)">
            </div>
            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div style="background:var(--hw-green); color:white; padding:20px; text-align:center; font-weight:bold;">
                OSTOSKORI (<span id="basket-count">0</span>)
                <span onclick="toggleSidebar('cart-sidebar')" style="float:right; cursor:pointer;">✕</span>
            </div>
            <div id="basket-items" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="openFullCart()" style="width:100%; padding:14px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">TARKASTELE JA LÄHETÄ</button>
            </div>
        </aside>
    </div>
</div>

<div id="fullCartModal">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('fullCartModal').style.display='none'">&times;</span>
        <h2>Tilausyhteenveto</h2>
        <div id="fullCartInfo"></div>
        <div id="fullCartItems"></div>
        <button onclick="finalSubmit()" style="width:100%; padding:20px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; margin-top:20px; cursor:pointer;">LÄHETÄ TILAUS</button>
    </div>
</div>

<div id="imgModal">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span>
        <h3 id="imgModalTitle"></h3>
        <img id="bigImg" style="width:100%; max-height:50vh; object-fit:contain;">
        <div id="guideLinks" style="margin-top:20px; display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<script>
let allData = {}; let cart = {}; let categories = []; let sallitut = {};
const GUIDE_TAGS = ["", "_ohje", "_Varaosat", "_Manual", "_tekniset tiedot"];

function toggleSidebar(id) { document.getElementById(id).classList.toggle('open'); }

async function doAppLogin() {
    try {
        const res = await fetch("käyttäjät.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const p = line.trim().split(/\s+/);
                if(p.length >= 2) sallitut[p[0].toLowerCase()] = p[1];
            });
        }
    } catch(e) {}

    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p || (u === "admin" && p === "hartwall")) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        loadAllData();
    } else { alert("Virhe!"); }
}

async function loadAllData() {
    const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
    if(r1.ok) {
        const t = await r1.text(); let cur = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            if(s.startsWith("*")) { cur = s.substring(1).trim(); allData[cur] = []; } 
            else if(cur) {
                const parts = s.split(/\s+/);
                allData[cur].push({code: parts[0], name: s.substring(parts[0].length).trim()});
            }
        });
    }
    if(r2.ok) {
        const t = await r2.text(); let curM = null;
        t.split("\n").forEach(l => {
            let s = l.trim(); if(!s) return;
            if(!l.startsWith("-")) { curM = {name: s, subs: []}; categories.push(curM); } 
            else if(curM) { curM.subs.push(s.substring(1).trim()); }
        });
    }
    renderNav(); render();
}

function renderNav() {
    let html = "";
    categories.forEach(c => {
        html += `<div class="nav-group"><div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} ▾</div>`;
        html += `<div class="nav-sub-list">${c.subs.map(s => `<div class="nav-sub-item" onclick="scrollToCat('${s}')">- ${s}</div>`).join('')}</div></div>`;
    });
    document.getElementById("dynamic-nav").innerHTML = html;
}

function scrollToCat(s) {
    document.getElementById("cat-" + s.replace(/\s+/g, '-').toLowerCase())?.scrollIntoView({behavior:"smooth"});
    if(window.innerWidth < 900) toggleSidebar('nav-sidebar');
}

function render(filter = "") {
    const list = document.getElementById("main-list");
    let fullHtml = "";
    for (const c of categories) {
        for (const sub of c.subs) {
            let prods = (allData[sub.trim()] || []).filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (prods.length === 0) continue;
            fullHtml += `<div class="category-title" id="cat-${sub.replace(/\s+/g, '-').toLowerCase()}">${sub}</div><div class="product-grid">`;
            prods.forEach(p => {
                fullHtml += `<div class="product-card ${cart[p.code]?'in-cart':''}">
                    <img class="thumb-img" src="images/${p.code}.png" loading="lazy" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}','${p.name.replace(/'/g,"\\'")}')">
                    <div style="font-weight:bold; height:34px; overflow:hidden;">${p.name}</div>
                    <div style="color:#666; font-size:11px; margin-bottom:10px;">${p.code}</div>
                    <div class="qty-area">
                        <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"\\'")}',-1)">-</button>
                        <input class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" readonly>
                        <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"\\'")}',1)">+</button>
                    </div>
                </div>`;
            });
            fullHtml += `</div>`;
        }
    }
    list.innerHTML = fullHtml;
}

async function openBigImg(code, name) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = code + " - " + name;
    const div = document.getElementById("guideLinks");
    div.innerHTML = "Etsitään ohjeita...";
    let html = "";
    for (let t of GUIDE_TAGS) {
        let url = `ohjeet/${code}${t}.pdf`;
        try {
            const res = await fetch(url, { method: 'HEAD' });
            if(res.ok) html += `<a href="${url}" target="_blank" style="padding:10px; background:#f0f7ff; border:1px solid #d0e3ff; border-radius:8px; text-decoration:none; color:var(--hw-blue); font-weight:bold;">📄 ${t?t.replace("_","").toUpperCase():'YLEISOHJE'}</a>`;
        } catch(e) {}
    }
    div.innerHTML = html || "Ei ohjeita.";
    document.getElementById("imgModal").style.display = "flex";
}

function updateQty(code, name, d) {
    let n = (cart[code]?.qty || 0) + d;
    if(n <= 0) delete cart[code]; else cart[code] = {code, name, qty: n};
    document.getElementById("basket-count").innerText = Object.keys(cart).length;
    renderCart(); render(document.getElementById("filter").value);
}

function renderCart() {
    document.getElementById("basket-items").innerHTML = Object.values(cart).map(i => `<div style="padding:10px; border-bottom:1px solid #eee;"><b>${i.qty} kpl</b> - ${i.name}</div>`).join('');
}

function openFullCart() {
    document.getElementById("fullCartItems").innerHTML = Object.values(cart).map(i => `<div style="padding:10px; border-bottom:1px solid #eee;">${i.qty} kpl : ${i.code} - ${i.name}</div>`).join('');
    document.getElementById("fullCartModal").style.display = "flex";
}

function finalSubmit() {
    const body = "Tilaus:\n" + Object.values(cart).map(i => `${i.qty} kpl : ${i.code} - ${i.name}`).join('\n');
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus&body=${encodeURIComponent(body)}`;
}
</script>
</body>
</html>
