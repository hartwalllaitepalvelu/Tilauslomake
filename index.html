<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --hw-gold:#fbc02d; --sidebar-w: 280px; }
body { font-family:'Inter', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* MODALS */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,45,147,0.8); display:flex; justify-content:center; align-items:center; z-index:100001; }
#pkgModal, #imgModal, #relatedOverlay, #fullCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; }

.app-container { display: flex; min-height: 100vh; }

/* SIDEBARS */
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease; z-index: 22000; }
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 22000; }

.nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; font-size: 14px; text-align: center; position: relative; }
.nav-group { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 12px 15px; font-weight: 700; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.nav-sub-list { display: none; background: white; }
.nav-group.active .nav-sub-list { display: block; }
.nav-sub-item { padding: 10px 15px 10px 30px; cursor: pointer; border-bottom: 1px solid #f9f9f9; color: #555; font-size: 13px; }

.close-nav { display: none; position: absolute; top: 10px; right: 15px; color: white; font-size: 24px; cursor: pointer; }
.main-content { flex: 1; padding: 20px; min-width: 0; }

/* MOBIILI */
.mobile-top-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 16000; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.mobile-btn { flex: 1; padding: 10px; background: var(--hw-blue); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }

/* TUOTEKORTIT */
.category-title { grid-column: 1 / -1; background: #e9ecef; color: var(--hw-blue); padding: 12px 15px; margin-top: 50px; margin-bottom: 15px; border-radius: 8px; font-size: 16px; font-weight: 800; text-transform: uppercase; border-left: 5px solid var(--hw-blue); }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 10px 0; }
.product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; transition: all 0.2s; position: relative; }
.product-card.in-cart { border: 2px solid var(--hw-green); background: #f0fff4; }
.thumb-img { width: 100px; height: 100px; object-fit: contain; background: white; cursor: zoom-in; margin-bottom: 10px; }

.qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; width: 100%; justify-content: center; }
.qty-btn { width: 32px; height: 32px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.qty-input { width: 50px; text-align: center; border: 1px solid #cbd5e0; padding: 5px; font-weight: bold; border-radius: 6px; }

.search-container { position: relative; margin-bottom: 20px; }
#filter { width: 100%; padding: 14px 45px 14px 20px; font-size: 15px; border: 2px solid var(--hw-blue); border-radius: 50px; box-sizing: border-box; }
#clearSearch { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 20px; color: #999; cursor: pointer; display: none; }

.modal-content { background:white; padding:30px; border-radius:16px; width:750px; max-width:95%; max-height:85vh; overflow-y:auto; position: relative; }
.close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }

@media (max-width: 900px) {
    .mobile-top-bar { display: flex; }
    .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); width: 85%; max-width: 320px; }
    .nav-sidebar.open { transform: translateX(0); }
    .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); width: 100%; }
    .cart-sidebar.open { transform: translateX(0); }
}
</style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div id="loginOverlay">
    <div class="login-box">
        <img src="392px-Hartwallin_logo.svg.png" alt="Hartwall Logo" style="width: 100%; max-width: 240px; margin-bottom: 25px;">
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-dark); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar">
        <button class="mobile-btn" onclick="toggleSidebar('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleSidebar('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">
                <span class="close-nav" onclick="toggleSidebar('nav-sidebar')">✕</span>
                <img src="392px-Hartwallin_logo.svg.png" style="width:130px; filter: brightness(0) invert(1); margin-bottom:10px;"><br>VARAOSAT
            </div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section" style="background:white; padding:20px; border-radius:12px; border:1px solid #e1e4e8; margin-bottom:20px;">
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px;">
                    <input id="f_tilaaja" placeholder="Tilaaja *">
                    <input id="f_varasto" placeholder="Varastonumero *">
                    <input id="f_pvm" type="date">
                    <select id="f_tapa">
                        <option value="Oma logistiikka">Oma logistiikka</option>
                        <option value="Kaukokiito">Kaukokiito</option>
                        <option value="Posti">Posti</option>
                    </select>
                    <input id="f_osoite" placeholder="Osoite *">
                    <input id="f_postinro" placeholder="Postinumero *">
                    <input id="f_paikka" placeholder="Paikkakunta *">
                    <textarea id="f_lisatiedot" placeholder="Lisätietoja..." style="grid-column: 1 / -1; height: 60px;"></textarea>
                </div>
            </div>

            <div class="search-container">
                <input id="filter" placeholder="Hae tuotteita..." oninput="handleSearchDebounced(this.value)">
                <button id="clearSearch" onclick="resetSearch()">✕</button>
            </div>

            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div style="background:var(--hw-green); color:white; padding:20px; text-align:center; font-weight:bold; position: relative;">
                OSTOSKORI (<span id="basket-count">0</span>)
                <span onclick="toggleSidebar('cart-sidebar')" style="position: absolute; right: 15px; cursor:pointer;">✕</span>
            </div>
            <div id="basket-items" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="openFullCart()" style="width:100%; padding:14px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">TARKASTELE JA LÄHETÄ</button>
            </div>
        </aside>
    </div>
</div>

<div id="fullCartModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('fullCartModal').style.display='none'">&times;</span><h2 style="color:var(--hw-green)">Tilausyhteenveto</h2><div id="fullCartInfo"></div><div id="fullCartItems"></div><button onclick="finalSubmit()" style="width:100%; padding:20px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; margin-top:20px; cursor:pointer;">LÄHETÄ TILAUS</button></div></div>
<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span><h3 id="imgModalTitle"></h3><img id="bigImg" style="width:100%; max-height:50vh; object-fit:contain;"><div id="guideLinks" style="margin-top:15px;"></div></div></div>

<script>
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; let sallitut = {};
let searchTimeout;

const GUIDE_TAGS = ["", "_tekniset tiedot", "_Asennusvaatimukset", "_Esite", "_Manual", "_Menu", "_Varaosat", "_varaosat", "_englanti", "_suomi", "_ohje", "_mittakuva"];

function toggleSidebar(id) { document.getElementById(id).classList.toggle('open'); }

// Debounce-haku: Säästää tehoja, kun haku ei suorita renderöintiä jokaisella kirjaimella
function handleSearchDebounced(val) {
    clearTimeout(searchTimeout);
    document.getElementById("clearSearch").style.display = val ? "block" : "none";
    searchTimeout = setTimeout(() => render(val), 250;
}

function resetSearch() {
    document.getElementById("filter").value = "";
    handleSearchDebounced("");
}

async function doAppLogin() {
    const res = await fetch("käyttäjät.txt").catch(() => null);
    if(res && res.ok) {
        const t = await res.text();
        t.split("\n").forEach(line => {
            const parts = line.trim().split(/\s+/);
            if(parts.length >= 2) sallitut[parts[0].toLowerCase()] = parts[1];
        });
    }
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadAllData();
    } else { alert("Virhe!"); }
}

async function loadAllData() {
    const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
    if(r1.ok) {
        const t = await r1.text(); let cur = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            if(s.startsWith("*")) { cur = s.substring(1).trim(); allData[cur] = []; } 
            else if(cur) {
                const parts = s.split(/\s+/);
                allData[cur].push({code: parts[0], name: s.substring(parts[0].length).trim()});
            }
        });
    }
    if(r2.ok) {
        const t = await r2.text(); let curM = null;
        t.split("\n").forEach(l => {
            let s = l.trim(); if(!s) return;
            if(!l.startsWith("-")) { curM = {name: s, subs: []}; categories.push(curM); } 
            else if(curM) { curM.subs.push(s.substring(1).trim()); }
        });
    }
    renderNav();
    render();
}

function renderNav() {
    let html = "";
    categories.forEach(c => {
        html += `<div class="nav-group">
            <div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} ▾</div>
            <div class="nav-sub-list">
                ${c.subs.map(s => `<div class="nav-sub-item" onclick="scrollToCat('${s}')">- ${s}</div>`).join('')}
            </div>
        </div>`;
    });
    document.getElementById("dynamic-nav").innerHTML = html;
}

function scrollToCat(s) {
    document.getElementById("cat-" + s.replace(/\s+/g, '-').toLowerCase())?.scrollIntoView({behavior:"smooth"});
    if(window.innerWidth < 900) toggleSidebar('nav-sidebar');
}

function render(filter = "") {
    const list = document.getElementById("main-list");
    let fullHtml = ""; // Kootaan koko sisältö muuttujaan ennen DOM-päivitystä (Nopeampi)
    
    for (const c of categories) {
        for (const sub of c.subs) {
            let prods = allData[sub.trim()] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) continue;
            
            fullHtml += `<div class="category-title" id="cat-${sub.replace(/\s+/g, '-').toLowerCase()}">${sub}</div>`;
            fullHtml += `<div class="product-grid">`;
            
            filt.forEach(p => {
                const inCart = cart[p.code] ? 'in-cart' : '';
                fullHtml += `
                    <div class="product-card ${inCart}" id="card_${p.code}">
                        <img class="thumb-img" src="images/${p.code}.png" loading="lazy" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}','${p.name.replace(/'/g, "\\'")}')">
                        <div style="font-weight:bold; font-size:13px; height:34px; overflow:hidden;">${p.name}</div>
                        <div style="font-size:11px; color:#666; margin-bottom:10px;">${p.code}</div>
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g, "\\'")}',-1)">-</button>
                            <input type="number" class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" onchange="setQty('${p.code}','${p.name.replace(/'/g, "\\'")}',this.value)">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g, "\\'")}',1)">+</button>
                        </div>
                    </div>`;
            });
            fullHtml += `</div>`;
        }
    }
    list.innerHTML = fullHtml;
}

async function openBigImg(code, name) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = code + " - " + name;
    const linksDiv = document.getElementById("guideLinks");
    linksDiv.innerHTML = "Etsitään ohjeita...";
    
    let html = "";
    // Tarkistetaan ohjeet vasta tässä vaiheessa (Nopeuttaa selailua)
    const checks = GUIDE_TAGS.map(async t => {
        const url = `ohjeet/${code}${t}.pdf`;
        const res = await fetch(url, { method: 'HEAD' }).catch(() => null);
        if(res && res.ok) {
            let label = t ? t.replace("_", "").toUpperCase() : "YLEISOHJE";
            return `<a href="${url}" target="_blank" style="display:block; padding:10px; background:#f0f7ff; border-radius:8px; margin-bottom:5px; text-decoration:none; color:var(--hw-blue); font-weight:bold;">📄 ${label}</a>`;
        }
        return null;
    });

    const results = await Promise.all(checks);
    html = results.filter(r => r !== null).join('');
    linksDiv.innerHTML = html || "<small style='color:#999'>Ei löytyneitä ohjeita.</small>";
    document.getElementById("imgModal").style.display = "flex";
}

function setQty(code, name, val) {
    let num = parseInt(val) || 0;
    if(num <= 0) {
        delete cart[code];
        document.getElementById("card_"+code)?.classList.remove("in-cart");
    } else {
        cart[code] = { code, name, qty: num };
        document.getElementById("card_"+code)?.classList.add("in-cart");
    }
    renderCart();
}

function updateQty(code, name, d) {
    let n = (cart[code]?.qty || 0) + d;
    setQty(code, name, n);
    document.getElementById("q_"+code).value = n > 0 ? n : 0;
}

function renderCart() {
    const div = document.getElementById("basket-items");
    div.innerHTML = Object.values(cart).map(i => `
        <div style="padding:10px; border-bottom:1px solid #eee;">
            <b>${i.qty} kpl</b> - ${i.name}
        </div>
    `).join('');
    document.getElementById("basket-count").innerText = Object.keys(cart).length;
}

function openFullCart() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value };
    document.getElementById("fullCartInfo").innerHTML = `<b>Tilaaja:</b> ${f.t}<br><b>Varasto:</b> ${f.v}`;
    document.getElementById("fullCartItems").innerHTML = Object.values(cart).map(i => `
        <div style="padding:10px; border-bottom:1px solid #eee;">${i.qty} kpl : ${i.code} - ${i.name}</div>
    `).join('');
    document.getElementById("fullCartModal").style.display = "flex";
}

function finalSubmit() {
    const t = document.getElementById("f_tilaaja").value;
    const body = "Tilaus:\n" + Object.values(cart).map(i => `${i.qty} kpl : ${i.code} - ${i.name}`).join('\n');
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus - ${t}&body=${encodeURIComponent(body)}`;
}
</script>

</body>
</html>
