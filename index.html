<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --sidebar-w: 280px; }
body { font-family:'Segoe UI', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* MODALS */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:100001; }
#pkgModal, #imgModal, #viewCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; }

.login-box { background:white; padding:40px; border-radius:12px; width:340px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.4); }
.login-box input { width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }

.app-container { display: flex; min-height: 100vh; }
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.nav-header { background: var(--hw-dark); color: white; padding: 20px; font-weight: bold; font-size: 16px; }
.nav-item { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
.nav-sub-list { display: none; background: #fafafa; padding-bottom: 10px; }
.nav-item.active .nav-sub-list { display: block; }

.main-content { flex: 1; padding: 20px; min-width: 0; }
.product-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; background: white; gap: 15px; }
.thumb-img { width: 50px; height: 50px; object-fit: contain; background: #eee; border-radius: 4px; border: 1px solid #ddd; cursor: zoom-in; }
.product-info { flex: 1; cursor: pointer; }

.qty-area { display: flex; align-items: center; gap: 10px; }
.qty-btn { width: 36px; height: 36px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 20px; }
.qty-input { width: 45px; text-align: center; border: 1px solid #cbd5e0; padding: 8px; font-weight: bold; border-radius: 6px; }

.modal-content { background:white; padding:40px; border-radius:16px; width:750px; max-width:95%; max-height:85vh; overflow-y:auto; position: relative; text-align: center; }
.close-x { position: absolute; top: 20px; right: 25px; font-size: 32px; cursor: pointer; color: #999; font-weight: bold; }

.guide-list { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.guide-link { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--hw-blue); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; width: 80%; justify-content: center; transition: 0.2s; }
.guide-link:hover { background: var(--hw-dark); transform: scale(1.02); }

.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.cart-header { background: var(--hw-green); color: white; padding: 20px; text-align: center; font-weight: bold; }
.cart-item-list { flex: 1; overflow-y: auto; padding: 10px; }

#adminSection { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2d3748; color: white; padding: 15px; z-index: 50000; box-sizing: border-box; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; }
#btnTop { position: fixed; bottom: 110px; right: 300px; background: var(--hw-blue); color: white; border: none; padding: 15px 25px; border-radius: 30px; display: none; z-index: 999; font-weight: bold; cursor: pointer; }

@media (max-width: 1100px) {
    .nav-sidebar, .cart-sidebar { position: fixed; left: -100%; top: 55px; z-index: 3000; width: 85%; height: calc(100vh - 55px); transition: 0.3s; }
    .cart-sidebar { right: -100%; left: auto; }
    .nav-sidebar.open { left: 0; }
    .cart-sidebar.open { right: 0; }
}
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--hw-blue)">Hartwall Varaosat</h2>
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="adminLoginPopup" style="display:none;">
    <div class="login-box">
        <h3>Ylläpito</h3>
        <input id="adminUser" placeholder="Tunnus">
        <input id="adminPass" type="password" placeholder="Salasana">
        <button onclick="doAdminLogin()" style="width:100%; padding:12px; background:var(--hw-dark); color:white; border:none; border-radius:6px; cursor:pointer;">KIRJAUDU</button>
        <button onclick="document.getElementById('adminLoginPopup').style.display='none'" style="margin-top:10px; color:red; cursor:pointer; background:none; border:none;">Peruuta</button>
    </div>
</div>

<div id="imgModal" onclick="if(event.target==this)this.style.display='none'">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span>
        <h3 id="imgModalTitle" style="color:var(--hw-blue); margin-top:0;"></h3>
        <img id="bigImg" style="max-width:100%; max-height:50vh; border-radius:8px; display:block; margin:auto;">
        <div id="guideLinks" class="guide-list"></div>
    </div>
</div>

<div id="viewCartModal" onclick="if(event.target==this)this.style.display='none'">
    <div class="modal-content" style="text-align: left;">
        <span class="close-x" onclick="document.getElementById('viewCartModal').style.display='none'">&times;</span>
        <h2 style="color:var(--hw-green); margin-top:0;">Tilausyhteenveto</h2>
        <div id="summary-info" style="background:#f9f9f9; padding:20px; border-radius:8px; margin-bottom:20px; display:grid; grid-template-columns:1fr 1fr; gap:15px; border:1px solid #eee;"></div>
        <div id="modal-cart-items" style="margin-bottom:30px; border:1px solid #eee; border-radius:8px;"></div>
        <button onclick="finalSubmit()" style="width:100%; padding:18px; background:var(--hw-green); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">TUOTERYHMÄT</div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div id="search-anchor" style="position:relative; max-width:600px; margin-bottom:15px;">
                <input id="filter" style="width:100%; padding:16px 20px; font-size:16px; border:2px solid var(--hw-blue); border-radius:50px; outline:none;" placeholder="Hae tuotteita..." oninput="render(this.value)">
            </div>
            <button onclick="openCartModal()" style="background:var(--hw-green); color:white; border:none; padding:14px 24px; border-radius:10px; font-weight:bold; cursor:pointer; margin-bottom:25px;">🛒 TARKASTELE TILAUSTA (<span id="btn-cart-count">0</span>)</button>
            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div class="cart-header">OSTOSKORI (<span id="basket-count">0</span>)</div>
            <div id="basket-items" class="cart-item-list"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="finalSubmit()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
                <button onclick="document.getElementById('adminLoginPopup').style.display='flex'" style="width:100%; margin-top:10px; background:none; border:none; color:#a0aec0; font-size:10px; cursor:pointer;">YLLÄPITO</button>
            </div>
        </aside>
    </div>
</div>

<div id="adminSection">
    <div style="font-weight:bold;">MUOKKAA:</div>
    <input id="adminCode" placeholder="Koodi" style="padding:8px; width:100px;">
    <label><input type="checkbox" id="adminOutOfStock"> LOPPU</label>
    <label><input type="checkbox" id="adminHide"> PIILOTA</label>
    <button onclick="saveStockStatus()" style="padding:8px 15px; background:var(--hw-green); color:white; border:none; cursor:pointer; font-weight:bold;">TALLENNA</button>
    <button onclick="document.getElementById('adminSection').style.display='none'" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">SULJE</button>
</div>

<script>
const sallitut = {"tomppa":"Tomi7122","markku":"parkinson","jaakko":"vendingjaska","dan":"huoltodan","tommi":"nappie","samia":"koksmeny","bob":"nayri","jouni":"paju1","jussi":"paukku","sami":"ruoska","jarno":"kurnu"};
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; let isAdmin = false;

function doAppLogin() {
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        loadLocalStock(); loadSavedCart(); loadFiles();
    } else { alert("Virhe!"); }
}

function doAdminLogin() {
    if (document.getElementById("adminUser").value === "admin" && document.getElementById("adminPass").value === "hartwall") {
        isAdmin = true;
        document.getElementById("adminLoginPopup").style.display = "none";
        document.getElementById("adminSection").style.display = "flex";
        render();
    } else { alert("Virhe!"); }
}

async function loadFiles() {
    try {
        const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
        if(r1.ok) {
            const t = await r1.text();
            let cur = null;
            t.split("\n").forEach(line => {
                let s = line.trim(); if(!s) return;
                if(!/\d/.test(s.split(" ")[0])) { cur = s; allData[cur] = []; }
                else if(cur) { allData[cur].push({code: s.split(" ")[0], name: s.substring(s.split(" ")[0].length).trim()}); }
            });
        }
        if(r2.ok) {
            const t = await r2.text();
            let curM = null;
            t.split("\n").forEach(l => {
                let s = l.trim(); if(!s) return;
                if(l.startsWith("-")) { if(curM) curM.subs.push(s.substring(1)); }
                else { curM = {name: s, subs: []}; categories.push(curM); }
            });
        }
        renderNav(); render();
    } catch(e) {}
}

function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let div = document.createElement("div"); div.className = "nav-item";
        div.innerHTML = `<div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} <span>▾</span></div>`;
        let subDiv = document.createElement("div"); subDiv.className = "nav-sub-list";
        c.subs.forEach(s => { 
            let item = document.createElement("div");
            item.style = "padding:10px 30px; cursor:pointer;";
            item.innerText = s;
            item.onclick = () => jumpTo(s);
            subDiv.appendChild(item);
        });
        div.appendChild(subDiv); nav.appendChild(div);
    });
}

function jumpTo(id) {
    const safeId = "cat-" + id.replace(/\s+/g, '-').toLowerCase();
    const el = document.getElementById(safeId);
    if(el) { el.scrollIntoView({behavior:"smooth", block: "start"}); }
}

// OHJEIDEN HAKU - KAIKKI PÄÄTTEET KUVISTASI
async function openBigImg(code, name) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = `${code} - ${name}`;
    const linksDiv = document.getElementById("guideLinks");
    linksDiv.innerHTML = "Etsitään ohjeita...";
    
    // Kuviesi perusteella käytössä olevat päätteet:
    const suffixes = [
        ".pdf",
        "_Asennusvaatimukset.pdf",
        "_Esite.pdf",
        "_Manual.pdf",
        "_Menu_valikot.pdf",
        "_Menu.pdf",
        "_Varaosat.pdf",
        "_tekniset tiedot.pdf",
        "_ohje.pdf",
        "_suomi.pdf",
        "_englantia.pdf",
        "_englanti.pdf"
    ];
    
    let found = 0;
    for (let s of suffixes) {
        let fname = code + s;
        let url = `ohjeet/${fname}`;
        // HEAD-pyyntö on nopea tapa tarkistaa onko tiedosto olemassa
        try {
            const res = await fetch(url, { method: 'HEAD' });
            if (res.ok) {
                if(found === 0) linksDiv.innerHTML = "";
                let a = document.createElement("a");
                a.className = "guide-link";
                a.href = url; a.target = "_blank";
                // Tehdään napin tekstistä siistimpi
                let label = s.replace(".pdf", "").replace("_", " ").toUpperCase() || "PDF OHJE";
                a.innerHTML = `📄 ${label}`;
                linksDiv.appendChild(a);
                found++;
            }
        } catch (e) {}
    }
    if(found === 0) linksDiv.innerHTML = "<small style='color:#999'>Ei löytyneitä ohjeita.</small>";
    document.getElementById("imgModal").style.display = 'flex';
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) return;
            const safeId = "cat-" + sub.replace(/\s+/g, '-').toLowerCase();
            list.innerHTML += `<div id="${safeId}" style="background:var(--hw-blue); color:white; padding:12px; margin:20px 0 10px 0; border-radius:8px; font-weight:bold;">${sub}</div>`;
            filt.forEach(p => {
                let s = stockStatus[p.code] || {};
                if (s.hidden && !isAdmin) return;
                list.innerHTML += `
                    <div class="product-item ${s.outOfStock ? 'out' : ''}">
                        <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}', '${p.name.replace(/'/g, "\\'")}')">
                        <div class="product-info" onclick="openBigImg('${p.code}', '${p.name.replace(/'/g, "\\'")}')">
                            <b>${p.name}</b><br><small>${p.code}</small>
                            ${s.outOfStock ? ' <b style="color:red">LOPPU!</b>' : ''}
                        </div>
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',-1)">-</button>
                            <input class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" readonly>
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',1)">+</button>
                        </div>
                    </div>`;
            });
        });
    });
}

function updateQty(code, name, delta) {
    if(!cart[code]) {
        if(!name) { for(let cat in allData) { let p = allData[cat].find(x => x.code === code); if(p) name = p.name; } }
        cart[code] = { code, name: name || "Tuote " + code, qty: 0 };
    }
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    localStorage.setItem("currentCart", JSON.stringify(cart));
    let el = document.getElementById("q_"+code); if(el) el.value = cart[code]?.qty || 0;
    renderCart();
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    Object.values(cart).forEach(i => {
        div.innerHTML += `<div class="cart-item"><div style="font-weight:bold; margin-bottom:10px;">${i.code} - ${i.name}</div><div class="qty-area" style="justify-content:flex-end; border-top:1px solid #f0f0f0; padding-top:10px;"><button class="qty-btn" style="width:28px; height:28px;" onclick="updateQty('${i.code}','${i.name}',-1)">-</button><input class="qty-input" style="width:35px;" value="${i.qty}" readonly><button class="qty-btn" style="width:28px; height:28px;" onclick="updateQty('${i.code}','${i.name}',1)">+</button></div></div>`;
    });
    document.getElementById("basket-count").textContent = Object.values(cart).length;
    document.getElementById("btn-cart-count").textContent = Object.values(cart).length;
}

function openCartModal() {
    const items = document.getElementById("modal-cart-items");
    const info = document.getElementById("summary-info");
    info.innerHTML = `<div><b>Tilaaja:</b> ${document.getElementById("f_tilaaja").value || '-'}</div><div><b>Pvm:</b> ${new Date().toLocaleDateString()}</div>`;
    items.innerHTML = "";
    Object.values(cart).forEach(i => { items.innerHTML += `<div style="padding:15px; border-bottom:1px solid #eee;"><b>${i.code}</b> - ${i.name} (${i.qty} kpl)</div>`; });
    document.getElementById("viewCartModal").style.display = "flex";
}

function finalSubmit() {
    let body = `Tilaus:\n`;
    Object.values(cart).forEach(i => { body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`; });
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus&body=${encodeURIComponent(body)}`;
}

function clearSearch() { document.getElementById("filter").value = ""; render(""); }
function loadLocalStock() { try { const r = localStorage.getItem("stockStatus"); if(r) stockStatus = JSON.parse(r); } catch(e){} }
function loadSavedCart() { const saved = localStorage.getItem("currentCart"); if(saved) { cart = JSON.parse(saved); renderCart(); } }
function saveStockStatus() { const c = document.getElementById("adminCode").value.trim(); if(!c) return; stockStatus[c] = { outOfStock: document.getElementById("adminOutOfStock").checked, hidden: document.getElementById("adminHide").checked }; localStorage.setItem("stockStatus", JSON.stringify(stockStatus)); render(); alert("Tallennettu!"); }
</script>

</body>
</html>
