<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { 
    --hw-blue: #004593; --hw-dark: #002d62; --hw-green: #28a745; 
    --hw-bg: #f8fafc; --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --sidebar-w: 280px; 
}

body { font-family: 'Inter', sans-serif; margin: 0; background: var(--hw-bg); color: #1e293b; padding-bottom: 80px; }

/* LOGIN */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
.login-box { background:white; padding:40px; border-radius:20px; width:340px; text-align:center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.login-box input { width:100%; padding:14px; margin-bottom:15px; border:1px solid #e2e8f0; border-radius:10px; box-sizing:border-box; font-size: 16px; }

/* LAYOUT */
.app-container { display: flex; min-height: 100vh; }
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #e2e8f0; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; font-size: 18px; text-align: center; }

.main-content { flex: 1; padding: 30px; min-width: 0; }

/* TUOTEKORTIT (GRID) */
#main-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; padding-top: 20px; }
.category-title { grid-column: 1 / -1; background: var(--hw-blue); color: white; padding: 15px 20px; border-radius: 12px; font-weight: bold; margin-top: 35px; }

.product-card { 
    background: white; border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; transition: 0.2s; border: 1px solid transparent;
}
.product-card:hover { transform: translateY(-5px); border-color: var(--hw-blue); }
.product-card.out { opacity: 0.6; filter: grayscale(1); pointer-events: none; }

.card-img-wrap { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; cursor: pointer; }
.card-img { max-width: 100%; max-height: 100%; object-fit: contain; }

.card-info { flex-grow: 1; text-align: center; margin-bottom: 15px; }
.card-name { font-weight: 700; font-size: 15px; display: block; height: 45px; overflow: hidden; color: var(--hw-dark); }
.card-code { color: #64748b; font-size: 12px; font-weight: 600; }

/* LISÄÄ-NAPPI */
.add-btn { 
    width: 100%; padding: 12px; border: none; border-radius: 10px; 
    background: var(--hw-blue); color: white; font-weight: bold; 
    cursor: pointer; transition: 0.3s;
}
.add-btn.in-cart { background: var(--hw-green); }

/* TOAST */
#toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
    background: #1e293b; color: white; padding: 12px 25px; border-radius: 50px; 
    font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
    display: none; z-index: 200000;
}

/* KELLUVA KORI (FAB) */
#fab-cart {
    position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; 
    border-radius: 50%; background: var(--hw-green); color: white; 
    display: flex; justify-content: center; align-items: center; 
    box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4); cursor: pointer; z-index: 10000;
}
#fab-count { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; display: flex; justify-content: center; align-items: center; font-weight: bold; }

/* MODALIT */
.modal-content { background:white; padding:30px; border-radius:20px; width:700px; max-width:90%; max-height:85vh; overflow-y:auto; position: relative; }
.guide-link { display: block; padding: 15px; background: #f1f5f9; color: var(--hw-blue); text-decoration: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; border-left: 5px solid var(--hw-blue); }

@media (max-width: 900px) { .nav-sidebar { display: none; } }
</style>
</head>
<body>

<div id="loginOverlay"><div class="login-box"><h2>Hartwall Varaosat</h2><input id="uField" placeholder="Käyttäjätunnus"><input id="pField" type="password" placeholder="Salasana"><button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button><p id="loginError" style="color:red; display:none;">Virheellinen tunnus.</p></div></div>

<div id="toast">Tuote lisätty! 🛒</div>

<div id="fab-cart" onclick="toggleSidebar('cart-sidebar')">
    <span style="font-size: 28px;">🛒</span>
    <div id="fab-count">0</div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="app-container">
        <nav class="nav-sidebar"><div class="nav-header">VALIKKO</div><div id="dynamic-nav"></div></nav>
        <main class="main-content">
            <div class="form-section">
                <div class="form-grid">
                    <input id="f_tilaaja" placeholder="Tilaajan nimi">
                    <input id="f_varasto" placeholder="Varastonumero">
                </div>
            </div>
            <input id="filter" style="width:100%; padding:18px 25px; border-radius:50px; border:2px solid #e2e8f0; font-size:16px; margin: 25px 0;" placeholder="Hae varaosia..." oninput="render(this.value)">
            <div id="main-list"></div>
        </main>
        
        <aside id="cart-sidebar" style="display:none; position:fixed; right:0; top:0; height:100%; width:320px; background:white; z-index:20000; box-shadow:-10px 0 30px rgba(0,0,0,0.1); padding:25px; flex-direction:column;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><h3>Ostoskori</h3><span onclick="toggleSidebar('cart-sidebar')" style="cursor:pointer; font-size:30px;">&times;</span></div>
            <div id="basket-items" style="flex-grow:1; overflow-y:auto;"></div>
            <button onclick="finalSubmit()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
        </aside>
    </div>
</div>

<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span style="position:absolute; top:15px; right:20px; cursor:pointer; font-size:25px;" onclick="document.getElementById('imgModal').style.display='none'">&times;</span><h3 id="imgModalTitle" style="color:var(--hw-blue)"></h3><img id="bigImg" style="width:100%; border-radius:15px; margin-bottom:20px;"><div id="guideLinks"></div></div></div>

<script>
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; 
let autoGuideStatus = {}; let allowedUsers = {}; let relatedItems = {};

// MÄÄRITETYT PÄÄTTEET JA AVAINSANAT
const KEYWORDS = ["tekniset tiedot", "Asennusvaatimukset", "Esite", "Manual", "Menu", "Varaosat", "englanti", "suomi", "ohje"];

async function loadUsers() {
    const res = await fetch("käyttäjät.txt");
    if(res.ok) {
        const text = await res.text();
        text.split("\n").forEach(line => {
            const p = line.trim().split(/\s+/);
            if(p.length >= 2) allowedUsers[p[0].toLowerCase()] = p[p.length - 1];
        });
    }
}
loadUsers();

function doAppLogin() {
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (allowedUsers[u] && allowedUsers[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        loadFiles();
    } else { document.getElementById("loginError").style.display="block"; }
}

// ÄLYKÄS OHJEIDEN TARKISTUS
async function checkGuideExists(code) {
    if(autoGuideStatus[code]) return;
    
    // Kokeillaan ensin pelkkää koodia
    const tests = [ `${code}.pdf`, `${code}.PDF` ];
    // Lisätään kokeiluun kaikki avainsanat
    KEYWORDS.forEach(k => {
        tests.push(`${code}_${k}.pdf`);
        tests.push(`${code}_${k}.PDF`);
    });

    for (let fileName of tests) {
        try {
            const res = await fetch(`ohjeet/${fileName}`, { method: 'HEAD' });
            if (res.ok) {
                autoGuideStatus[code] = true;
                const icon = document.getElementById(`icon-${code}`);
                if(icon) icon.style.display = 'inline';
                break;
            }
        } catch (e) {}
    }
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) return;

            list.innerHTML += `<div class="category-title">${sub}</div>`;
            filt.forEach(p => {
                let s = stockStatus[p.code] || { outOfStock: false };
                const inCart = cart[p.code] ? 'in-cart' : '';
                const btnText = cart[p.code] ? `KORISSA (${cart[p.code].qty})` : 'LISÄÄ KORIIN';
                
                list.innerHTML += `
                    <div class="product-card ${s.outOfStock ? 'out' : ''}">
                        <div class="card-img-wrap" onclick="openBigImg('${p.code}')">
                            <img class="card-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                        </div>
                        <div class="card-info">
                            <span class="card-name">${p.name} <span id="icon-${p.code}" style="display:none">📄</span></span>
                            <span class="card-code">${p.code}</span>
                        </div>
                        <button class="add-btn ${inCart}" onclick="updateQty('${p.code}','${p.name}', 1)">${btnText}</button>
                    </div>`;
                
                checkGuideExists(p.code);
            });
        });
    });
}

function updateQty(code, name, delta) {
    if(!cart[code]) cart[code] = { code, name, qty: 0 };
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    
    if(delta > 0) {
        const t = document.getElementById("toast");
        t.style.display = "block";
        setTimeout(() => t.style.display = "none", 2000);
    }
    renderCart();
    render(document.getElementById("filter").value);
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    let total = 0;
    Object.values(cart).forEach(i => {
        total += i.qty;
        div.innerHTML += `<div style="padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:13px;"><b>${i.code}</b><br>${i.name}</div>
            <div style="display:flex; align-items:center; gap:10px;">
                <button onclick="updateQty('${i.code}','',-1)" style="border:none; border-radius:5px; width:30px;">-</button>
                <b>${i.qty}</b>
                <button onclick="updateQty('${i.code}','',1)" style="border:none; border-radius:5px; width:30px;">+</button>
            </div>
        </div>`;
    });
    document.getElementById("fab-count").innerText = total;
    document.getElementById("btn-cart-count").innerText = total;
}

async function openBigImg(code) {
    let name = "Varaosa";
    for(let cat in allData) { let p = allData[cat].find(x => x.code === code); if(p) { name = p.name; break; } }
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = `${code} - ${name}`;
    const linksDiv = document.getElementById("guideLinks");
    linksDiv.innerHTML = "Etsitään ohjeita...";
    document.getElementById("imgModal").style.display = "flex";

    let html = "";
    // Kokeillaan kaikki yhdistelmät modaalissa
    const tests = [ `${code}.pdf`, `${code}.PDF` ];
    KEYWORDS.forEach(k => tests.push(`${code}_${k}.pdf`, `${code}_${k}.PDF`));

    for (let f of tests) {
        try {
            const res = await fetch(`ohjeet/${f}`, { method: 'HEAD' });
            if (res.ok) {
                let label = f.includes("_") ? f.split("_")[1].replace(".pdf","").replace(".PDF","").toUpperCase() : "OHJE";
                html += `<a class="guide-link" href="ohjeet/${f}" target="_blank">📄 AVAA ${label}</a>`;
            }
        } catch (e) {}
    }
    linksDiv.innerHTML = html || "<p style='color:#999'>Ei ohjeita saatavilla.</p>";
}

// DATA LATAUS
async function loadFiles() {
    const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
    if(r1.ok) {
        const t = await r1.text(); let cur = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            if(!/^\d/.test(s.split(" ")[0]) && !s.includes("V0") && !s.includes("T0")) { cur = s; allData[cur] = []; }
            else if(cur) { 
                const code = s.split(" ")[0];
                allData[cur].push({code: code, name: s.substring(code.length).trim()}); 
            }
        });
    }
    if(r2.ok) {
        const t = await r2.text(); let curM = null;
        t.split("\n").forEach(l => {
            let s = l.trim(); if(!s) return;
            if(l.startsWith("-")) { if(curM) curM.subs.push(s.substring(1)); }
            else { curM = {name: s, subs: []}; categories.push(curM); }
        });
    }
    loadGlobalStock(); loadPackages(); renderNav(); render();
}

// MUUT APUFUNKTIOT
function toggleSidebar(id) { const el = document.getElementById(id); el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'flex' : 'none'; }
function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let div = document.createElement("div"); div.style.padding="15px 20px"; div.style.fontWeight="600"; div.style.cursor="pointer"; div.style.borderBottom="1px solid #eee";
        div.innerText = c.name; div.onclick = () => { 
            const el = Array.from(document.querySelectorAll('.category-title')).find(x => x.innerText === c.subs[0]);
            if(el) el.scrollIntoView({behavior:"smooth"});
        };
        nav.appendChild(div);
    });
}
async function loadGlobalStock() { const res = await fetch("varastotilanne.txt"); if(res.ok) { const text = await res.text(); text.split("\n").forEach(line => { const p = line.trim().split(";"); if(p.length >= 4) stockStatus[p[0]] = { outOfStock: p[1] === "true" }; }); render(); } }
async function loadPackages() { const res = await fetch("asennuspaketit.txt"); if(res.ok) { const text = await res.text(); let name = null; asennusPaketit = {}; text.split("\n").forEach(line => { let s = line.trim(); if(!s) return; let p = s.split(/\s+/); if(p.length>=2 && /\d/.test(p[p.length-1])) { if(name) asennusPaketit[name].push({code:p[0], qty:parseInt(p[p.length-1])||1}); } else { name = s; asennusPaketit[name]=[]; } }); renderPkgs(); } }
function renderPkgs() { const div = document.getElementById("pkg-buttons"); div.innerHTML = ""; Object.keys(asennusPaketit).forEach(n => { div.innerHTML += `<button style="padding:10px 15px; background:var(--hw-blue); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600;" onclick="openPkgModal('${n}')">${n}</button>`; }); }
function openPkgModal(n) { document.getElementById("imgModalTitle").innerText = n; const links = document.getElementById("guideLinks"); links.innerHTML = "<b>Paketin sisältö:</b><br>"; asennusPaketit[n].forEach(i => { links.innerHTML += `<div>${i.code} - ${i.qty} kpl</div>`; }); currentPkgItems = asennusPaketit[n]; document.getElementById("imgModal").style.display = "flex"; }
function finalSubmit() { const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value }; if(!f.t || !f.v) return alert("Täytä tilaaja ja varastonumero!"); let body = `Tilaaja: ${f.t}\nVarasto: ${f.v}\n\nTuotteet:\n`; Object.values(cart).forEach(i => { body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`; }); window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Varaosatilaus&body=${encodeURIComponent(body)}`; }
</script>
</body>
</html>
