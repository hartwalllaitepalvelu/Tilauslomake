<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --hw-gold:#fbc02d; --sidebar-w: 280px; }
body { font-family:'Inter', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* LOGIN & MODALS */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
.login-box { text-align: center; background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 320px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; box-sizing: border-box; }

#fullCartModal, #imgModal, #pkgModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200000; justify-content:center; align-items:center; }
.modal-content { background:white; padding:30px; border-radius:16px; width:750px; max-width:95%; max-height:85vh; overflow-y:auto; position: relative; color: #333; }
.close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }

.app-container { display: flex; min-height: 100vh; }

/* SIDEBARS */
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; z-index: 22000; }
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; z-index: 22000; transition: transform 0.3s ease; }

.nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; text-align: center; }
.nav-group { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 12px 15px; font-weight: 700; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; }
.nav-sub-list { display: none; background: white; }
.nav-group.active .nav-sub-list { display: block; }
.nav-sub-item { padding: 10px 15px 10px 30px; cursor: pointer; border-bottom: 1px solid #f9f9f9; color: #555; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* FORM SECTION */
.form-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 20px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-weight: bold; color: var(--hw-blue); font-size: 12px; }
.form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-family: inherit; }

/* PRODUCT CARDS */
.category-title { grid-column: 1 / -1; background: #e9ecef; color: var(--hw-blue); padding: 12px 15px; margin-top: 40px; border-radius: 8px; font-weight: 800; text-transform: uppercase; border-left: 5px solid var(--hw-blue); scroll-margin-top: 20px; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 15px 0; }
.product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; position: relative; }
.product-card.in-cart { border: 2px solid var(--hw-green); background: #f0fff4; }
.thumb-img { width: 100px; height: 100px; object-fit: contain; cursor: zoom-in; }

.qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; }
.qty-btn { width: 30px; height: 30px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-weight: bold; }
.qty-input { width: 45px; text-align: center; border: 1px solid #cbd5e0; padding: 5px; border-radius: 6px; font-weight: bold; }

/* MISC */
#btnTop { position: fixed; bottom: 30px; right: 300px; background: var(--hw-blue); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; display: none; z-index: 9999; cursor: pointer; font-size: 20px; }
#filter { width: 100%; padding: 14px 20px; border: 2px solid var(--hw-blue); border-radius: 50px; box-sizing: border-box; outline: none; margin-bottom: 20px; }

@media (max-width: 900px) {
    .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); width: 85%; }
    .nav-sidebar.open { transform: translateX(0); }
    .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); width: 100%; }
    .cart-sidebar.open { transform: translateX(0); }
    #btnTop { right: 20px; }
}
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <img src="392px-Hartwallin_logo.svg.png" style="width: 100%; max-width: 240px; margin-bottom: 25px;">
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-dark); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">VARAOSAT</div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section">
                <div class="form-grid">
                    <div class="form-group"><label>Tilaaja *</label><input id="f_tilaaja" placeholder="Nimi"></div>
                    <div class="form-group"><label>Varastonumero *</label><input id="f_varasto" placeholder="Esim. LP011"></div>
                    <div class="form-group"><label>Osoite *</label><input id="f_osoite" placeholder="Katuosoite"></div>
                    <div class="form-group"><label>Postinumero *</label><input id="f_postinro" placeholder="00000"></div>
                    <div class="form-group"><label>Paikkakunta *</label><input id="f_paikka" placeholder="Kaupunki"></div>
                    <div class="form-group">
                        <label>Toimitustapa *</label>
                        <select id="f_tapa">
                            <option value="Oma logistiikka (ensisijaisesti aina tämä)">Oma logistiikka (ensisijaisesti aina tämä)</option>
                            <option value="Kaukokiito">Kaukokiito</option>
                            <option value="Posti">Posti</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: 1/-1;"><label>Lisätietoja</label><textarea id="f_lisatiedot" placeholder=""></textarea></div>
                    <div class="form-group" style="grid-column: 1/-1;"><label>Listalta puuttuvat tuotteet</label><textarea id="f_puuttuvat" placeholder="Lisää nimi ja kappalemäärä..."></textarea></div>
                </div>
            </div>

            <div style="background:#fff9c4; padding:20px; border-radius:12px; border:2px solid #fbc02d; margin-bottom:30px;">
                <div style="font-weight:bold; margin-bottom:10px; color:var(--hw-blue);">VALMIIT ASENNUSPAKETIT</div>
                <div id="pkg-buttons" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
            </div>

            <input id="filter" placeholder="Hae tuotteita..." oninput="render(this.value)">
            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div style="background:var(--hw-green); color:white; padding:20px; text-align:center; font-weight:bold;">OSTOSKORI (<span id="basket-count">0</span>)</div>
            <div id="basket-items" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="openFullCart()" style="width:100%; padding:14px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">TARKASTELE JA LÄHETÄ</button>
            </div>
        </aside>
    </div>
</div>

<div id="pkgModal">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('pkgModal').style.display='none'">&times;</span>
        <h3 id="pkgModalTitle"></h3>
        <div id="pkgModalItems"></div>
        <button onclick="confirmPkgToCart()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; margin-top:15px; cursor:pointer;">LISÄÄ KAIKKI KORIIN</button>
    </div>
</div>

<div id="fullCartModal">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('fullCartModal').style.display='none'">&times;</span>
        <h2 style="color:var(--hw-green)">Tilausyhteenveto</h2>
        <div id="fullCartInfo" style="margin-bottom:20px; line-height:1.6; border-bottom:1px solid #eee; padding-bottom:10px;"></div>
        <div id="fullCartItems"></div>
        <button onclick="finalSubmit()" style="width:100%; padding:20px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; margin-top:20px; cursor:pointer;">VAHVISTA JA LÄHETÄ TILAUS</button>
    </div>
</div>

<div id="imgModal">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span>
        <h3 id="imgModalTitle"></h3>
        <img id="bigImg" style="width:100%; max-height:50vh; object-fit:contain;">
        <div id="guideLinks" style="margin-top:20px; display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<button onclick="window.scrollTo({top:0, behavior:'smooth'})" id="btnTop">↑</button>

<script>
let allData = {}; let cart = {}; let categories = []; let sallitut = {}; let asennusPaketit = {};
let currentPkgItems = [];
window.onscroll = () => { document.getElementById("btnTop").style.display = window.scrollY > 300 ? "block" : "none"; };

async function doAppLogin() {
    try {
        const res = await fetch("käyttäjät.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const p = line.trim().split(/\s+/);
                if(p.length >= 2) sallitut[p[0].toLowerCase()] = p[1];
            });
        }
    } catch(e) {}
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p || (u === "admin" && p === "hartwall")) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        loadAllData();
    } else alert("Virhe!");
}

async function loadAllData() {
    const [r1, r2, r3] = await Promise.all([
        fetch("data.txt"), 
        fetch("kategoriat.txt"),
        fetch("asennuspaketit.txt")
    ]);
    
    if(r1.ok) {
        const t = await r1.text(); let cur = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            if(s.startsWith("*")) { cur = s.substring(1).trim(); allData[cur] = []; } 
            else if(cur) {
                const parts = s.split(/\s+/);
                allData[cur].push({code: parts[0], name: s.substring(parts[0].length).trim()});
            }
        });
    }
    if(r2.ok) {
        const t = await r2.text(); let curM = null;
        t.split("\n").forEach(l => {
            let s = l.trim(); if(!s) return;
            if(!l.startsWith("-")) { curM = {name: s, subs: []}; categories.push(curM); } 
            else if(curM) { curM.subs.push(s.substring(1).trim()); }
        });
    }
    if(r3.ok) {
        const t = await r3.text(); let name = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            const parts = s.split(/\s+/);
            if(parts.length === 1 || isNaN(parts[parts.length-1])) {
                name = s; asennusPaketit[name] = [];
            } else if(name) {
                asennusPaketit[name].push({ code: parts[0], qty: parseInt(parts[parts.length-1]) });
            }
        });
        renderPkgs();
    }
    renderNav(); render();
}

function renderNav() {
    document.getElementById("dynamic-nav").innerHTML = categories.map(c => `
        <div class="nav-group">
            <div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} ▾</div>
            <div class="nav-sub-list">${c.subs.map(s => `<div class="nav-sub-item" onclick="scrollToCat('${s}')">- ${s}</div>`).join('')}</div>
        </div>`).join('');
}

function scrollToCat(s) {
    document.getElementById("cat-" + s.replace(/\s+/g, '-').toLowerCase())?.scrollIntoView({behavior:"smooth"});
    if(window.innerWidth < 900) document.getElementById("nav-sidebar").classList.remove("open");
}

function render(filter = "") {
    const list = document.getElementById("main-list");
    let html = "";
    for (const c of categories) {
        for (const sub of c.subs) {
            let prods = (allData[sub.trim()] || []).filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (prods.length === 0) continue;
            html += `<div class="category-title" id="cat-${sub.replace(/\s+/g, '-').toLowerCase()}">${sub}</div><div class="product-grid">`;
            prods.forEach(p => {
                html += `<div class="product-card ${cart[p.code]?'in-cart':''}">
                    <img class="thumb-img" src="images/${p.code}.png" loading="lazy" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}','${p.name.replace(/'/g,"\\'")}')">
                    <div style="font-weight:bold; height:34px; overflow:hidden;">${p.name}</div>
                    <div style="color:#666; font-size:11px; margin-bottom:10px;">${p.code}</div>
                    <div class="qty-area">
                        <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"\\'")}',-1)">-</button>
                        <input type="number" class="qty-input" value="${cart[p.code]?.qty || 0}" onchange="setQty('${p.code}','${p.name.replace(/'/g,"\\'")}', this.value)">
                        <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"\\'")}',1)">+</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
        }
    }
    list.innerHTML = html;
}

function setQty(code, name, val) {
    let n = parseInt(val) || 0;
    if(n <= 0) delete cart[code]; else cart[code] = {code, name, qty: n};
    renderCart();
    const card = document.querySelector(`.product-card img[onclick*="${code}"]`)?.parentElement;
    if(card) { card.classList.toggle('in-cart', n > 0); card.querySelector('.qty-input').value = n; }
}

function updateQty(code, name, d) { setQty(code, name, (cart[code]?.qty || 0) + d); }

function renderCart() {
    document.getElementById("basket-count").innerText = Object.keys(cart).length;
    document.getElementById("basket-items").innerHTML = Object.values(cart).map(i => `
        <div style="padding:10px; border-bottom:1px solid #eee;">
            <b>${i.code}</b> - ${i.name}<br>
            <div class="qty-area" style="margin-top:5px; justify-content: flex-start;">
                <button class="qty-btn" onclick="updateQty('${i.code}','${i.name.replace(/'/g,"\\'")}',-1)">-</button>
                <input type="number" class="qty-input" value="${i.qty}" onchange="setQty('${i.code}','${i.name.replace(/'/g,"\\'")}', this.value)">
                <button class="qty-btn" onclick="updateQty('${i.code}','${i.name.replace(/'/g,"\\'")}',1)">+</button>
            </div>
        </div>`).join('');
}

function renderPkgs() {
    document.getElementById("pkg-buttons").innerHTML = Object.keys(asennusPaketit).map(name => `
        <button onclick="openPkgModal('${name}')" style="padding:10px; background:var(--hw-blue); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">${name}</button>
    `).join('');
}

function openPkgModal(name) {
    document.getElementById("pkgModalTitle").innerText = name;
    currentPkgItems = JSON.parse(JSON.stringify(asennusPaketit[name]));
    document.getElementById("pkgModalItems").innerHTML = currentPkgItems.map((item, idx) => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;">
            <span><b>${item.code}</b></span>
            <div class="qty-area">
                <button class="qty-btn" onclick="updatePkgItemQty(${idx},-1)">-</button>
                <input type="number" class="qty-input" value="${item.qty}" readonly>
                <button class="qty-btn" onclick="updatePkgItemQty(${idx},1)">+</button>
            </div>
        </div>`).join('');
    document.getElementById("pkgModal").style.display = "flex";
}

function updatePkgItemQty(idx, d) {
    currentPkgItems[idx].qty = Math.max(0, currentPkgItems[idx].qty + d);
    document.querySelectorAll("#pkgModalItems .qty-input")[idx].value = currentPkgItems[idx].qty;
}

function confirmPkgToCart() {
    currentPkgItems.forEach(i => { if(i.qty > 0) setQty(i.code, findNameByCode(i.code), i.qty); });
    document.getElementById("pkgModal").style.display = "none";
}

function findNameByCode(code) {
    for (let cat in allData) { let f = allData[cat].find(x => x.code === code); if(f) return f.name; }
    return code;
}

async function openBigImg(code, name) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = code + " - " + name;
    const div = document.getElementById("guideLinks"); div.innerHTML = "Etsitään ohjeita...";
    let html = "";
    const tags = ["", "_ohje", "_Varaosat", "_Manual", "_tekniset tiedot"];
    for (let t of tags) {
        let url = `ohjeet/${code}${t}.pdf`;
        try { const res = await fetch(url, { method: 'HEAD' }); if(res.ok) html += `<a href="${url}" target="_blank" style="padding:10px; background:#f0f7ff; border:1px solid #d0e3ff; border-radius:8px; text-decoration:none; color:var(--hw-blue); font-weight:bold;">📄 ${t?t.replace("_","").toUpperCase():'YLEISOHJE'}</a>`; } catch(e) {}
    }
    div.innerHTML = html || "Ei ohjeita.";
    document.getElementById("imgModal").style.display = "flex";
}

function openFullCart() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value, o: document.getElementById("f_osoite").value, p: document.getElementById("f_postinro").value, k: document.getElementById("f_paikka").value, l: document.getElementById("f_lisatiedot").value };
    document.getElementById("fullCartInfo").innerHTML = `<b>Tilaaja:</b> ${f.t}<br><b>Varasto:</b> ${f.v}<br><b>Osoite:</b> ${f.o}, ${f.p} ${f.k}<br><b>Lisätiedot:</b> ${f.l || '-'}`;
    document.getElementById("fullCartItems").innerHTML = Object.values(cart).map(i => `<div style="padding:10px; border-bottom:1px solid #eee;">[ ] &nbsp;&nbsp; ${i.qty} kpl &nbsp;&nbsp; ${i.code} - ${i.name}</div>`).join('');
    document.getElementById("fullCartModal").style.display = "flex";
}

function finalSubmit() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value, o: document.getElementById("f_osoite").value, p: document.getElementById("f_postinro").value, k: document.getElementById("f_paikka").value, tapa: document.getElementById("f_tapa").value, l: document.getElementById("f_lisatiedot").value, puut: document.getElementById("f_puuttuvat").value };
    if(!f.t || !f.v) return alert("Täytä tilaaja ja varasto!");
    
    let itemsStr = Object.values(cart).map(i => `[ ]   ${i.qty} kpl   ${i.code} - ${i.name}`).join('\n');
    let body = `Tilaaja: ${f.t}\nVarasto: ${f.v}\nOsoite: ${f.o}, ${f.p} ${f.k}\nToimitustapa: ${f.tapa}\nLisätiedot: ${f.l}\n\nTUOTTEET:\n${itemsStr}`;
    if(f.puut) body += `\n\nPUUTTUVAT TUOTTEET:\n${f.puut}`;
    
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus - ${f.t} - ${f.v}&body=${encodeURIComponent(body)}`;
}
</script>
</body>
</html>
