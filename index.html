<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hartwall Varaosatilaus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --hw-gold:#fbc02d; --sidebar-w: 280px; }
        body { font-family:'Inter', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

        /* MODALS */
        #loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
        #fullCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200000; justify-content:center; align-items:center; }

        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; cursor: pointer; color: #666; }

        .app-container { display: flex; min-height: 100vh; }

        /* SIDEBARS */
        .nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease; z-index: 22000; }
        .cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 22000; }

        .nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; font-size: 14px; text-align: center; }
        .nav-group { border-bottom: 1px solid #eee; }
        .nav-main-cat { padding: 12px 15px; font-weight: 700; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; }
        .nav-sub-list { display: none; background: white; }
        .nav-group.active .nav-sub-list { display: block; }
        .nav-sub-item { padding: 10px 15px 10px 30px; cursor: pointer; border-bottom: 1px solid #f9f9f9; font-size: 13px; }

        .main-content { flex: 1; padding: 20px; min-width: 0; }

        /* MOBIILI */
        .mobile-top-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 16000; gap: 10px; }
        .mobile-btn { flex: 1; padding: 10px; background: var(--hw-blue); color: white; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }

        @media (max-width: 900px) {
            .mobile-top-bar { display: flex; }
            .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); width: 85%; }
            .nav-sidebar.open { transform: translateX(0); }
            .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); width: 100%; }
            .cart-sidebar.open { transform: translateX(0); }
        }

        /* TUOTEKORTIT */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; border: 1px solid #e1e4e8; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-3px); }
        .product-card.in-cart { border: 2px solid var(--hw-green); background: #f0fff4; }
        .thumb-img { width: 100px; height: 100px; object-fit: contain; }

        .form-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .form-grid input, .form-grid select, .form-grid textarea { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; width: 100%; box-sizing: border-box; }

        .qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; }
        .qty-btn { width: 30px; height: 30px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .qty-input { width: 40px; text-align: center; border: 1px solid #ddd; border-radius: 4px; font-weight: bold; }

        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000000; pointer-events: none; }
        .toast { background: var(--hw-dark); color: white; padding: 10px 20px; border-radius: 20px; margin-top: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<!-- KIRJAUTUMISRUUTU -->
<div id="loginOverlay">
    <div style="text-align:center; background:white; padding:40px; border-radius:20px; width:320px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
        <img src="392px-Hartwallin_logo.svg.png" alt="Logo" style="width: 200px; margin-bottom: 20px;" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Hartwallin_logo.svg/392px-Hartwallin_logo.svg.png'">
        <h3 style="margin-bottom:20px; color:var(--hw-blue);">Varaosatilaus</h3>
        <input id="uField" placeholder="Käyttäjätunnus" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
        <input id="pField" type="password" placeholder="Salasana" style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
        <div id="loginStatus" style="margin-top:15px; font-size:12px; color:red;"></div>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar">
        <button class="mobile-btn" onclick="toggleSidebar('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleSidebar('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <!-- NAVIGAATIO -->
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">VARAOSATILAUKSET</div>
            <div id="dynamic-nav"></div>
        </nav>

        <!-- PÄÄSISÄLTÖ -->
        <main class="main-content">
            <div class="form-section">
                <h3>Toimitustiedot</h3>
                <div class="form-grid">
                    <input id="f_tilaaja" placeholder="Tilaaja *">
                    <input id="f_varasto" placeholder="Varastonumero *">
                    <input id="f_pvm" type="date">
                    <select id="f_tapa">
                        <option value="Oma logistiikka">Oma logistiikka</option>
                        <option value="Kaukokiito">Kaukokiito</option>
                        <option value="Posti">Posti</option>
                    </select>
                    <input id="f_osoite" placeholder="Osoite *">
                    <input id="f_postinro" placeholder="Postinumero *">
                    <input id="f_paikka" placeholder="Paikkakunta *">
                </div>
            </div>

            <input id="filter" placeholder="Hae tuotetta tai koodia..." oninput="render(this.value)" style="width:100%; padding:15px; border:2px solid var(--hw-blue); border-radius:30px; margin-bottom:20px; box-sizing:border-box; outline:none;">
            
            <div id="main-list"></div>
        </main>

        <!-- OSTOSKORI SIVUPALKKI -->
        <aside id="cart-sidebar" class="cart-sidebar">
            <div style="background:var(--hw-green); color:white; padding:20px; text-align:center; font-weight:bold;">OSTOSKORI (<span id="basket-count">0</span>)</div>
            <div id="basket-items" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="openFullCart()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">TARKASTELE JA LÄHETÄ</button>
            </div>
        </aside>
    </div>
</div>

<!-- OSTOSKORIN MODAALI -->
<div id="fullCartModal">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('fullCartModal').style.display='none'">&times;</span>
        <h2 style="color:var(--hw-green)">Tilausyhteenveto</h2>
        <div id="fullCartInfo" style="margin-bottom:20px; padding:15px; background:#f9f9f9; border-radius:10px; border:1px solid #eee; line-height:1.6;"></div>
        <div id="fullCartItems"></div>
        <button onclick="finalSubmit()" style="width:100%; padding:18px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; margin-top:20px; font-size:16px;">VAHVISTA JA LÄHETÄ TILAUS</button>
    </div>
</div>

<script>
    let allData = {}; let cart = {}; let categories = []; let sallitut = {};

    // LADATAAN KÄYTTÄJÄT HETI KUN SIVU LATAUTUU
    window.onload = async () => {
        try {
            const response = await fetch("käyttäjät.txt");
            if(response.ok) {
                const text = await response.text();
                // Käsitellään jokainen rivi: poistetaan tyhjät ja ylimääräiset välit
                text.split(/\r?\n/).forEach(line => {
                    const parts = line.trim().split(/\s+/); // Splittaa millä tahansa välilyönnillä tai tabilla
                    if(parts.length >= 2) {
                        sallitut[parts[0].toLowerCase()] = parts[1];
                    }
                });
                console.log("Käyttäjät ladattu onnistuneesti.");
            } else {
                console.error("käyttäjät.txt ei löytynyt palvelimelta.");
            }
        } catch(e) {
            console.error("Virhe ladattaessa käyttäjiä:", e);
        }
    };

    function toggleSidebar(id) { document.getElementById(id).classList.toggle('open'); }
    
    function showToast(msg) {
        const t = document.createElement("div"); t.className = "toast"; t.innerText = msg;
        document.getElementById("toastContainer").appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    function doAppLogin() {
        const u = document.getElementById("uField").value.trim().toLowerCase();
        const p = document.getElementById("pField").value.trim();
        const status = document.getElementById("loginStatus");

        if (!u || !p) {
            status.innerText = "Syötä tunnus ja salasana!";
            return;
        }

        // Tarkistus
        if (sallitut[u] && sallitut[u] === p) {
            document.getElementById("loginOverlay").style.display="none";
            document.getElementById("appWrapper").style.display="block";
            document.getElementById("f_pvm").valueAsDate = new Date();
            loadStoreData();
        } else {
            status.innerText = "Väärä käyttäjätunnus tai salasana!";
        }
    }

    async function loadStoreData() {
        try {
            const [rCats, rData] = await Promise.all([
                fetch("kategoriat.txt").then(r => r.ok ? r.text() : ""),
                fetch("data.txt").then(r => r.ok ? r.text() : "")
            ]);

            if(rCats) {
                let cur = null;
                rCats.split(/\r?\n/).forEach(l => {
                    let s = l.trim(); if(!s) return;
                    if(!l.startsWith("-")) {
                        cur = {name: s, subs: []}; categories.push(cur);
                    } else if(cur) {
                        cur.subs.push(s.substring(1).trim());
                    }
                });
            }

            if(rData) {
                let curCat = null;
                rData.split(/\r?\n/).forEach(l => {
                    let s = l.trim(); if(!s) return;
                    if(s.startsWith("*")) {
                        curCat = s.substring(1).trim(); allData[curCat] = [];
                    } else if(curCat) {
                        const p = s.split(/\s+/);
                        allData[curCat].push({code: p[0], name: s.substring(p[0].length).trim()});
                    }
                });
            }
            renderNav(); render();
        } catch(e) { console.error("Virhe tuotetietojen latauksessa:", e); }
    }

    function renderNav() {
        const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
        categories.forEach(c => {
            let div = document.createElement("div"); div.className = "nav-group";
            div.innerHTML = `<div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} ▾</div>`;
            let subList = document.createElement("div"); subList.className = "nav-sub-list";
            c.subs.forEach(s => {
                let item = document.createElement("div"); item.className = "nav-sub-item"; item.innerText = s;
                item.onclick = () => { render(s); if(window.innerWidth < 900) toggleSidebar('nav-sidebar'); };
                subList.appendChild(item);
            });
            div.appendChild(subList); nav.appendChild(div);
        });
    }

    function render(filter = "") {
        const list = document.getElementById("main-list"); list.innerHTML = "";
        let found = false;
        
        Object.keys(allData).forEach(cat => {
            let filtered = allData[cat].filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()) || cat.toLowerCase().includes(filter.toLowerCase()));
            if(filtered.length > 0) {
                found = true;
                list.innerHTML += `<div style="background:var(--hw-blue); color:white; padding:10px; margin-top:20px; font-weight:bold; border-radius:5px;">${cat}</div>`;
                let grid = document.createElement("div"); grid.className = "product-grid";
                filtered.forEach(p => {
                    grid.innerHTML += `
                        <div class="product-card ${cart[p.code] ? 'in-cart' : ''}">
                            <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                            <div style="font-weight:bold; margin: 10px 0; text-align:center; font-size:13px; min-height:32px;">${p.name}</div>
                            <div style="font-size:11px; color:#666; margin-bottom:10px;">Koodi: ${p.code}</div>
                            <div class="qty-area">
                                <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"")}',-1)">-</button>
                                <input type="number" class="qty-input" value="${cart[p.code]?.qty || 0}" readonly>
                                <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"")}',1)">+</button>
                            </div>
                        </div>`;
                });
                list.appendChild(grid);
            }
        });
        if(!found) list.innerHTML = "<p style='text-align:center; padding:20px;'>Tuotteita ei löytynyt. Kokeile eri hakusanaa tai valitse kategoria valikosta.</p>";
    }

    function updateQty(code, name, change) {
        let current = cart[code]?.qty || 0;
        let newQty = current + change;
        if(newQty <= 0) delete cart[code];
        else {
            cart[code] = {code, name, qty: newQty};
            if(change > 0) showToast("Lisätty: " + name);
        }
        renderCart(); render(document.getElementById("filter").value);
    }

    function renderCart() {
        const div = document.getElementById("basket-items"); div.innerHTML = "";
        let total = 0;
        Object.values(cart).forEach(i => {
            total++;
            div.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                <div style="max-width:70%;"><b>${i.code}</b><br><small>${i.name}</small></div>
                <div style="font-weight:bold; background:#eee; padding:5px 10px; border-radius:5px;">${i.qty}</div></div>`;
        });
        document.getElementById("basket-count").innerText = total;
        document.getElementById("m-count").innerText = total;
    }

    function openFullCart() {
        if(Object.keys(cart).length === 0) return alert("Ostoskori on tyhjä!");
        
        const info = `
            <b>Tilaaja:</b> ${document.getElementById("f_tilaaja").value || "---"}<br>
            <b>Varastonumero:</b> ${document.getElementById("f_varasto").value || "---"}<br>
            <b>Toimitusosoite:</b> ${document.getElementById("f_osoite").value || ""}, ${document.getElementById("f_postinro").value || ""} ${document.getElementById("f_paikka").value || ""}
        `;
        document.getElementById("fullCartInfo").innerHTML = info;
        
        let html = "";
        Object.values(cart).forEach(i => { 
            html += `<div style="padding:12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                        <span><b>${i.qty} kpl</b> - ${i.code} ${i.name}</span>
                     </div>`; 
        });
        document.getElementById("fullCartItems").innerHTML = html;
        document.getElementById("fullCartModal").style.display = "flex";
    }

    function finalSubmit() {
        const t = document.getElementById("f_tilaaja").value;
        const v = document.getElementById("f_varasto").value;
        if(!t || !v) return alert("Ole hyvä ja täytä vähintään tilaajan nimi ja varastonumero!");

        let subject = `Varaosatilaus - ${t} (${v})`;
        let body = `TILAAJAN TIEDOT:\n----------------------\n`;
        body += `Tilaaja: ${t}\nVarastonumero: ${v}\nOsoite: ${document.getElementById("f_osoite").value}, ${document.getElementById("f_postinro").value} ${document.getElementById("f_paikka").value}\n`;
        body += `Toimitustapa: ${document.getElementById("f_tapa").value}\n\n`;
        body += `TILATUT TUOTTEET:\n----------------------\n`;
        
        Object.values(cart).forEach(i => {
            body += `${i.qty} kpl : ${i.code} - ${i.name}\n`;
        });

        window.location.href = `mailto:lpvarasto@hartwall.fi?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }
</script>

</body>
</html>
