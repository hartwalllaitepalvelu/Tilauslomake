<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --sidebar-w: 280px; }
body { font-family:'Segoe UI', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* Z-INDEX & MODALS */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,45,147,0.8); display:flex; justify-content:center; align-items:center; z-index:100001; }
#pkgModal, #imgModal, #relatedOverlay, #viewCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; }

.login-box { background:white; padding:40px; border-radius:12px; width:340px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.4); }
.login-box input { width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }

.app-container { display: flex; min-height: 100vh; }

/* NAV SIDEBAR (Mobiili-yhteensopiva) */
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s; }
.nav-header { background: var(--hw-dark); color: white; padding: 20px; font-weight: bold; font-size: 16px; }
.nav-item { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
.nav-sub-list { display: none; background: #fafafa; padding-bottom: 10px; }
.nav-item.active .nav-sub-list { display: block; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* MOBIILIPALKKI */
.mobile-top-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 10000; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.mobile-btn { flex: 1; padding: 10px; background: var(--hw-blue); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }

/* GRID & KORTIT */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 10px 0; }
.product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; transition: transform 0.2s; position: relative; }
.product-card.out { opacity: 0.6; background: #f9f9f9; }
.product-card.out img { filter: grayscale(1); }

.thumb-img { width: 100px; height: 100px; object-fit: contain; background: white; cursor: zoom-in; margin-bottom: 10px; }
.card-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; height: 34px; overflow: hidden; line-height: 1.2; display: flex; align-items: center; justify-content: center; }
.card-code { font-size: 11px; color: #666; margin-bottom: 10px; }

.qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; width: 100%; justify-content: center; }
.qty-btn { width: 30px; height: 30px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.qty-input { width: 35px; text-align: center; border: 1px solid #cbd5e0; padding: 5px; font-weight: bold; border-radius: 6px; font-size: 14px; }

.category-title { background: var(--hw-blue); color: white; padding: 10px 15px; margin: 25px 0 10px 0; border-radius: 8px; font-weight: bold; width: 100%; box-sizing: border-box; }

/* OSTOSKORI SIVUSTA (Mobiili-yhteensopiva) */
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s; }
.cart-header { background: var(--hw-green); color: white; padding: 20px; text-align: center; font-weight: bold; }
.cart-item-list { flex: 1; overflow-y: auto; padding: 10px; }
.cart-item { padding: 10px; border: 1px solid #eee; background: white; border-radius: 8px; margin-bottom: 10px; }

/* RESPONSIVISET SÄÄDÖT */
@media (max-width: 900px) {
    .mobile-top-bar { display: flex; }
    .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); z-index: 15000; }
    .nav-sidebar.open { transform: translateX(0); }
    .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); z-index: 15000; }
    .cart-sidebar.open { transform: translateX(0); }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    #btnTop { right: 20px !important; }
}

.form-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.form-group label { font-size: 10px; font-weight: 700; color: #555; margin-bottom: 2px; text-transform: uppercase; }
.form-group input { padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 13px; }

#adminSection { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2d3748; color: white; padding: 10px; z-index: 50000; flex-wrap: wrap; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<div id="loginOverlay"><div class="login-box"><h2 style="color:var(--hw-blue)">Hartwall Varaosat</h2><input id="uField" placeholder="Käyttäjätunnus"><input id="pField" type="password" placeholder="Salasana"><button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button></div></div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar">
        <button class="mobile-btn" onclick="toggleMenu('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleMenu('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">TUOTERYHMÄT <span onclick="toggleMenu('nav-sidebar')" style="float:right; cursor:pointer; display:none;" class="close-mob">✕</span></div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section">
                <div class="form-grid">
                    <div class="form-group"><label>Tilaaja *</label><input id="f_tilaaja"></div>
                    <div class="form-group"><label>Varastonumero *</label><input id="f_varasto"></div>
                    <div class="form-group"><label>Päivämäärä *</label><input id="f_pvm" type="date"></div>
                    <div class="form-group"><label>Toimitustapa *</label><input id="f_tapa"></div>
                    <div class="form-group"><label>Osoite *</label><input id="f_osoite"></div>
                    <div class="form-group"><label>Postinumero *</label><input id="f_postinro"></div>
                    <div class="form-group"><label>Paikkakunta *</label><input id="f_paikka"></div>
                </div>
            </div>

            <div id="search-anchor" style="position:relative; margin-bottom:15px;">
                <input id="filter" style="width:100%; padding:14px 20px; font-size:15px; border:2px solid var(--hw-blue); border-radius:50px; box-sizing:border-box;" placeholder="Hae tuotteita..." oninput="render(this.value)">
            </div>

            <button id="btnViewCart" onclick="openCartModal()">🛒 TARKASTELE TILAUSTA (<span id="btn-cart-count">0</span>)</button>

            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div class="cart-header">OSTOSKORI (<span id="basket-count">0</span>) <span onclick="toggleMenu('cart-sidebar')" style="float:right; cursor:pointer; display:none;" class="close-mob">✕</span></div>
            <div id="basket-items" class="cart-item-list"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="finalSubmit()" style="width:100%; padding:12px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
            </div>
        </aside>
    </div>
</div>

<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span><h3 id="imgModalTitle"></h3><img id="bigImg"><div id="guideLinks" class="guide-list"></div></div></div>
<div id="viewCartModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('viewCartModal').style.display='none'">&times;</span><h2 id="summary-main-title">Tilausyhteenveto</h2><div id="summary-info"></div><div id="modal-cart-items"></div><button onclick="document.getElementById('viewCartModal').style.display='none'; finalSubmit();" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:10px; font-weight:bold;">LÄHETÄ TILAUS</button></div></div>

<script>
// Logiikka säilytetty täysin samana, lisätty vain mobiili-toggle ja varastotilanteen luku
const sallitut = {"tomppa":"Tomi7122","markku":"parkinson","jaakko":"vendingjaska","dan":"huoltodan","tommi":"nappie","samia":"koksmeny","bob":"nayri","jouni":"paju1","jussi":"paukku","sami":"ruoska","jurni":"kurnu"};
let allData = {}; let cart = {}; let categories = []; let stockStatus = {};

function doAppLogin() {
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadStockStatus();
        loadFiles();
    } else { alert("Kirjautuminen epäonnistui!"); }
}

async function loadStockStatus() {
    try {
        const res = await fetch("varastotilanne.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const parts = line.trim().split(";");
                if(parts.length >= 4) {
                    stockStatus[parts[0]] = { outOfStock: parts[1] === "true", hidden: parts[2] === "true", eta: parts[3] };
                }
            });
            render();
        }
    } catch(e) {}
}

async function loadFiles() {
    const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
    if(r1.ok) {
        const t = await r1.text(); let cur = null;
        t.split("\n").forEach(line => {
            let s = line.trim(); if(!s) return;
            if(!/\d/.test(s.split(" ")[0])) { cur = s; allData[cur] = []; }
            else if(cur) { allData[cur].push({code: s.split(" ")[0], name: s.substring(s.split(" ")[0].length).trim()}); }
        });
    }
    if(r2.ok) {
        const t = await r2.text(); let curM = null;
        t.split("\n").forEach(l => {
            let s = l.trim(); if(!s) return;
            if(l.startsWith("-")) { if(curM) curM.subs.push(s.substring(1)); }
            else { curM = {name: s, subs: []}; categories.push(curM); }
        });
    }
    renderNav(); render();
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) return;
            
            let title = document.createElement("div"); title.className = "category-title"; title.innerText = sub; title.id = "cat-" + sub.replace(/\s+/g, '-').toLowerCase();
            list.appendChild(title);

            let grid = document.createElement("div"); grid.className = "product-grid";
            filt.forEach(p => {
                let s = stockStatus[p.code] || {};
                if (s.hidden) return;
                grid.innerHTML += `
                    <div class="product-card ${s.outOfStock ? 'out' : ''}">
                        <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}')">
                        <div class="card-title">${p.name}</div>
                        <div class="card-code">${p.code}</div>
                        ${s.outOfStock ? `<div style="color:red; font-size:10px; font-weight:bold; margin-bottom:5px;">LOPPU! ${s.eta ? 'ETA: '+s.eta : ''}</div>` : ''}
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',-1)">-</button>
                            <input class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" readonly>
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',1)">+</button>
                        </div>
                    </div>`;
            });
            list.appendChild(grid);
        });
    });
}

function toggleMenu(id) { document.getElementById(id).classList.toggle('open'); }

function updateQty(code, name, delta) {
    if(!cart[code]) cart[code] = { code, name, qty: 0 };
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    let el = document.getElementById("q_"+code); if(el) el.value = cart[code]?.qty || 0;
    renderCart();
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    Object.values(cart).forEach(i => {
        div.innerHTML += `<div class="cart-item"><b>${i.code}</b><br>${i.name}<br>Määrä: ${i.qty}</div>`;
    });
    const count = Object.values(cart).length;
    document.getElementById("basket-count").innerText = count;
    document.getElementById("btn-cart-count").innerText = count;
    document.getElementById("m-count").innerText = count;
}

function jumpTo(id) {
    const safeId = "cat-" + id.replace(/\s+/g, '-').toLowerCase();
    const el = document.getElementById(safeId);
    if(el) el.scrollIntoView({behavior:"smooth", block: "start"});
    toggleMenu('nav-sidebar');
}

function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let div = document.createElement("div"); div.className = "nav-item";
        div.innerHTML = `<div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} <span>▾</span></div>`;
        let subDiv = document.createElement("div"); subDiv.className = "nav-sub-list";
        c.subs.forEach(s => { 
            let item = document.createElement("div"); item.style = "padding:10px 30px; cursor:pointer;"; item.innerText = s; item.onclick = () => jumpTo(s); subDiv.appendChild(item);
        });
        div.appendChild(subDiv); nav.appendChild(div);
    });
}

async function openBigImg(code) {
    let name = "Varaosa";
    for(let cat in allData) { let p = allData[cat].find(x => x.code === code); if(p) { name = p.name; break; } }
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = `${code} - ${name}`;
    document.getElementById("imgModal").style.display = "flex";
}

function openCartModal() {
    const info = document.getElementById("summary-info");
    info.innerHTML = `Tilaaja: ${document.getElementById("f_tilaaja").value} | Varasto: ${document.getElementById("f_varasto").value}`;
    document.getElementById("viewCartModal").style.display = "flex";
}

function finalSubmit() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value };
    if(!f.t || !f.v) return alert("Täytä tilaajatiedot!");
    let body = `Tilaaja: ${f.t}\nVarasto: ${f.v}\nTuotteet:\n`;
    Object.values(cart).forEach(i => { body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`; });
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus - ${f.t}&body=${encodeURIComponent(body)}`;
}
</script>

<button onclick="window.scrollTo({top:0, behavior:'smooth'})" id="btnTop">YLÖS ↑</button>

</body>
</html>
