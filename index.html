<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hartwall Varaosatilaus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --hw-blue:#004593; 
            --hw-dark:#002d62; 
            --hw-green:#28a745; 
            --hw-gold:#fbc02d; 
            --sidebar-w: 280px; 
        }
        
        body { font-family:'Inter', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

        /* MODALS & OVERLAYS */
        #loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
        #adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,45,147,0.8); display:none; justify-content:center; align-items:center; z-index:100001; }
        
        /* Korjattu Modaali-tyyli */
        #pkgModal, #imgModal, #fullCartModal { 
            display:none; 
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%; 
            background:rgba(0,0,0,0.85); 
            z-index:200000; /* Nostettu z-index */
            justify-content:center; 
            align-items:center; 
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .close-x {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
            line-height: 1;
        }

        .app-container { display: flex; min-height: 100vh; }

        /* SIDEBARS */
        .nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease; z-index: 22000; }
        .cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 22000; }

        .nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; font-size: 14px; text-align: center; position: relative; }
        .nav-group { border-bottom: 1px solid #eee; }
        .nav-main-cat { padding: 12px 15px; font-weight: 700; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .nav-sub-list { display: none; background: white; }
        .nav-group.active .nav-sub-list { display: block; }
        .nav-sub-item { padding: 10px 15px 10px 30px; cursor: pointer; border-bottom: 1px solid #f9f9f9; color: #555; font-size: 13px; }

        .main-content { flex: 1; padding: 20px; min-width: 0; }

        /* MOBIILI */
        .mobile-top-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 16000; gap: 10px; }
        .mobile-btn { flex: 1; padding: 10px; background: var(--hw-blue); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-weight: bold; cursor: pointer; }

        @media (max-width: 900px) {
            .mobile-top-bar { display: flex; }
            .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); width: 85%; max-width: 320px; }
            .nav-sidebar.open { transform: translateX(0); }
            .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); width: 100%; }
            .cart-sidebar.open { transform: translateX(0); }
        }

        /* TUOTEKORTIT */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 10px 0; }
        .product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; transition: all 0.2s; position: relative; }
        .product-card.in-cart { border: 2px solid var(--hw-green); background: #f0fff4; }
        .thumb-img { width: 100px; height: 100px; object-fit: contain; cursor: zoom-in; }

        /* LOMAKKEET */
        .form-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .form-grid input, .form-grid select, .form-grid textarea { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; width: 100%; box-sizing: border-box; }

        .category-title { grid-column: 1 / -1; background: #e9ecef; color: var(--hw-blue); padding: 12px 15px; margin-top: 30px; border-radius: 8px; font-weight: 800; text-transform: uppercase; border-left: 5px solid var(--hw-blue); }

        .qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; }
        .qty-btn { width: 30px; height: 30px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .qty-input { width: 40px; text-align: center; border: 1px solid #ddd; border-radius: 4px; }

        .info-box { background: white; border-left: 5px solid var(--hw-blue); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000000; }
        .toast { background: var(--hw-dark); color: white; padding: 10px 20px; border-radius: 20px; margin-top: 5px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<!-- KIRJAUTUMINEN -->
<div id="loginOverlay">
    <div style="text-align:center; background:white; padding:40px; border-radius:20px; width:320px;">
        <img src="392px-Hartwallin_logo.svg.png" alt="Logo" style="width: 200px; margin-bottom: 20px;">
        <input id="uField" placeholder="Käyttäjätunnus" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
        <input id="pField" type="password" placeholder="Salasana" style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar">
        <button class="mobile-btn" onclick="toggleSidebar('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleSidebar('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <!-- VASEN NAVIGAATIO -->
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">VARAOSATILAUS</div>
            <div id="dynamic-nav"></div>
        </nav>

        <!-- KESKIALUE -->
        <main class="main-content">
            <div class="form-section">
                <h3>Toimitustiedot</h3>
                <div class="form-grid">
                    <input id="f_tilaaja" placeholder="Tilaaja *">
                    <input id="f_varasto" placeholder="Varastonumero *">
                    <input id="f_pvm" type="date">
                    <select id="f_tapa">
                        <option value="Oma logistiikka">Oma logistiikka</option>
                        <option value="Kaukokiito">Kaukokiito</option>
                        <option value="Posti">Posti</option>
                    </select>
                    <input id="f_osoite" placeholder="Osoite *">
                    <input id="f_postinro" placeholder="Postinumero *">
                    <input id="f_paikka" placeholder="Paikkakunta *">
                    <textarea id="f_lisatiedot" placeholder="Lisätietoja..." style="grid-column: 1 / -1; height: 50px;"></textarea>
                </div>
            </div>

            <div class="info-box">🚚 <b>Toimitusaika:</b> n. 8 työpäivää.</div>

            <div style="margin: 20px 0;">
                <input id="filter" placeholder="Hae tuotetta tai koodia..." oninput="handleSearch(this.value)" style="width:100%; padding:15px; border:2px solid var(--hw-blue); border-radius:30px; font-size:16px; box-sizing:border-box;">
            </div>

            <div id="main-list"></div>
        </main>

        <!-- OIKEA OSTOSKORI -->
        <aside id="cart-sidebar" class="cart-sidebar">
            <div style="background:var(--hw-green); color:white; padding:20px; text-align:center; font-weight:bold;">
                OSTOSKORI (<span id="basket-count">0</span>)
            </div>
            <div id="basket-items" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="openFullCart()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">TARKASTELE JA LÄHETÄ</button>
            </div>
        </aside>
    </div>
</div>

<!-- OSTOSKORIN YHTEENVETO MODAALI -->
<div id="fullCartModal">
    <div class="modal-content">
        <span class="close-x" onclick="document.getElementById('fullCartModal').style.display='none'">&times;</span>
        <h2 style="color:var(--hw-green)">Tilausyhteenveto</h2>
        <div id="fullCartInfo" style="margin-bottom:20px; padding:15px; background:#f9f9f9; border-radius:10px; line-height:1.6; border: 1px solid #eee;"></div>
        <div id="fullCartItems"></div>
        <button onclick="finalSubmit()" style="width:100%; padding:18px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; font-size:16px; margin-top:20px; cursor:pointer;">VAHVISTA JA LÄHETÄ TILAUS</button>
    </div>
</div>

<script>
    let allData = {}; 
    let cart = {}; 
    let categories = []; 
    let sallitut = {};

    function toggleSidebar(id) {
        document.getElementById(id).classList.toggle('open');
    }

    function showToast(msg) {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    async function doAppLogin() {
        const u = document.getElementById("uField").value.trim().toLowerCase();
        const p = document.getElementById("pField").value.trim();
        
        // Demo-kirjautuminen jos tiedostoa ei löydy, muuten käytetään käyttäjät.txt
        if (Object.keys(sallitut).length === 0) {
            if(u === "hartwall" && p === "varasto") { loginSuccess(); return; }
        }

        if (sallitut[u] === p) {
            loginSuccess();
        } else {
            alert("Väärä tunnus tai salasana!");
        }
    }

    function loginSuccess() {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadData();
    }

    async function loadData() {
        try {
            const [r1, r2, r3] = await Promise.all([
                fetch("data.txt"), 
                fetch("kategoriat.txt"),
                fetch("käyttäjät.txt").catch(() => null)
            ]);

            if(r3 && r3.ok) {
                const t = await r3.text();
                t.split("\n").forEach(line => {
                    const parts = line.trim().split(/\s+/);
                    if(parts.length >= 2) sallitut[parts[0].toLowerCase()] = parts[1];
                });
            }

            if(r2.ok) {
                const t = await r2.text();
                let current = null;
                t.split("\n").forEach(l => {
                    let s = l.trim(); if(!s) return;
                    if(!l.startsWith("-")) {
                        current = {name: s, subs: []};
                        categories.push(current);
                    } else if(current) {
                        current.subs.push(s.substring(1).trim());
                    }
                });
            }

            if(r1.ok) {
                const t = await r1.text();
                let curCat = null;
                t.split("\n").forEach(line => {
                    let s = line.trim(); if(!s) return;
                    if(s.startsWith("*")) {
                        curCat = s.substring(1).trim();
                        allData[curCat] = [];
                    } else if(curCat) {
                        const p = s.split(/\s+/);
                        allData[curCat].push({code: p[0], name: s.substring(p[0].length).trim()});
                    }
                });
            }
            renderNav();
            render();
        } catch(e) { console.error("Data load error", e); }
    }

    function renderNav() {
        const nav = document.getElementById("dynamic-nav");
        nav.innerHTML = "";
        categories.forEach(c => {
            let div = document.createElement("div");
            div.className = "nav-group";
            div.innerHTML = `<div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} ▾</div>`;
            let subList = document.createElement("div");
            subList.className = "nav-sub-list";
            c.subs.forEach(s => {
                let item = document.createElement("div");
                item.className = "nav-sub-item";
                item.innerText = s;
                item.onclick = () => {
                    const el = document.getElementById("sec-" + s.replace(/\s+/g, ''));
                    if(el) el.scrollIntoView({behavior:"smooth"});
                    if(window.innerWidth < 900) toggleSidebar('nav-sidebar');
                };
                subList.appendChild(item);
            });
            div.appendChild(subList);
            nav.appendChild(div);
        });
    }

    function render(filter = "") {
        const list = document.getElementById("main-list");
        list.innerHTML = "";
        
        categories.forEach(c => {
            c.subs.forEach(sub => {
                let prods = allData[sub] || [];
                let filtered = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
                
                if(filtered.length > 0) {
                    let title = document.createElement("div");
                    title.className = "category-title";
                    title.id = "sec-" + sub.replace(/\s+/g, '');
                    title.innerText = sub;
                    list.appendChild(title);

                    let grid = document.createElement("div");
                    grid.className = "product-grid";
                    filtered.forEach(p => {
                        const inCart = cart[p.code] ? 'in-cart' : '';
                        grid.innerHTML += `
                            <div class="product-card ${inCart}">
                                <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                                <div style="font-weight:bold; margin: 10px 0 5px;">${p.name}</div>
                                <div style="font-size:11px; color:#666; margin-bottom:10px;">${p.code}</div>
                                <div class="qty-area">
                                    <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"")}',-1)">-</button>
                                    <input type="number" class="qty-input" value="${cart[p.code]?.qty || 0}" readonly>
                                    <button class="qty-btn" onclick="updateQty('${p.code}','${p.name.replace(/'/g,"")}',1)">+</button>
                                </div>
                            </div>`;
                    });
                    list.appendChild(grid);
                }
            });
        });
    }

    function updateQty(code, name, change) {
        let current = cart[code]?.qty || 0;
        let newQty = current + change;
        if(newQty <= 0) {
            delete cart[code];
        } else {
            cart[code] = {code, name, qty: newQty};
            if(change > 0) showToast("Lisätty: " + name);
        }
        renderCart();
        render(document.getElementById("filter").value);
    }

    function renderCart() {
        const div = document.getElementById("basket-items");
        div.innerHTML = "";
        let count = 0;
        Object.values(cart).forEach(i => {
            count++;
            div.innerHTML += `
                <div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                    <div><b>${i.code}</b><br><small>${i.name}</small></div>
                    <div style="font-weight:bold;">${i.qty} kpl</div>
                </div>`;
        });
        document.getElementById("basket-count").innerText = count;
        document.getElementById("m-count").innerText = count;
    }

    function handleSearch(val) {
        render(val);
    }

    function openFullCart() {
        const tilaaja = document.getElementById("f_tilaaja").value || "---";
        const varasto = document.getElementById("f_varasto").value || "---";
        const osoite = document.getElementById("f_osoite").value || "";
        const post = document.getElementById("f_postinro").value || "";
        const paikka = document.getElementById("f_paikka").value || "";
        
        if(Object.keys(cart).length === 0) return alert("Kori on tyhjä!");

        document.getElementById("fullCartInfo").innerHTML = `
            <strong>Tilaaja:</strong> ${tilaaja}<br>
            <strong>Varasto:</strong> ${varasto}<br>
            <strong>Osoite:</strong> ${osoite}, ${post} ${paikka}
        `;

        let html = "";
        Object.values(cart).forEach(i => {
            html += `<div style="padding:10px; border-bottom:1px solid #eee;">
                        <b>${i.qty} kpl</b> - ${i.code} ${i.name}
                     </div>`;
        });
        document.getElementById("fullCartItems").innerHTML = html;
        document.getElementById("fullCartModal").style.display = "flex";
    }

    function finalSubmit() {
        const t = document.getElementById("f_tilaaja").value;
        const v = document.getElementById("f_varasto").value;
        if(!t || !v) return alert("Täytä vähintään tilaaja ja varastonumero!");

        let subject = `Tilaus - ${t} - ${v}`;
        let body = `Tilaaja: ${t}\nVarasto: ${v}\nOsoite: ${document.getElementById("f_osoite").value}\n\nTuotteet:\n`;
        
        Object.values(cart).forEach(i => {
            body += `${i.qty} kpl : ${i.code} - ${i.name}\n`;
        });

        const mailto = `mailto:lpvarasto@hartwall.fi?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        window.location.href = mailto;
    }
</script>

</body>
</html>
