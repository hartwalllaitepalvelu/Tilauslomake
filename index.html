<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --sidebar-w: 280px; }
body { font-family:'Segoe UI', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* KIRJAUTUMINEN - Nostettu kaiken muun päälle */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,45,147,0.8); display:flex; justify-content:center; align-items:center; z-index:100001; }
.login-box { background:white; padding:40px; border-radius:12px; width:340px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.4); }
.login-box input { width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }

.app-container { display: flex; min-height: 100vh; }

/* NAVIGAATIO */
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.nav-header { background: var(--hw-dark); color: white; padding: 20px; font-weight: bold; font-size: 16px; }
.nav-item { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
.nav-sub-list { display: none; background: #fafafa; padding-bottom: 10px; }
.nav-item.active .nav-sub-list { display: block; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* MOBIILI */
.mobile-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 2000; gap: 10px; }
.mobile-btn { flex: 1; padding: 12px; background: var(--hw-blue); color: white; border: 1px solid white; border-radius: 6px; font-weight: bold; cursor: pointer; }

/* TUOTTEET */
.product-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; background: white; gap: 15px; }
.product-item.out { opacity: 0.5; background: #f0f0f0; }
.thumb-img { width: 50px; height: 50px; object-fit: contain; background: #eee; border-radius: 4px; border: 1px solid #ddd; cursor: zoom-in; flex-shrink: 0; }
.product-info { flex: 1; cursor: pointer; }
.product-info:hover b { color: var(--hw-blue); text-decoration: underline; }

/* MODALIT (Kuvat, Kori, Paketit) */
#pkgModal, #imgModal, #relatedOverlay, #viewCartModal { 
    display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
    background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; 
}
.modal-content { 
    background:white; padding:30px; border-radius:16px; width:700px; 
    max-width:95%; max-height:85vh; overflow-y:auto; position: relative;
}
.modal-img-big { max-width: 90%; max-height: 85vh; object-fit: contain; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
.close-x { position: absolute; top: 20px; right: 25px; font-size: 32px; cursor: pointer; color: #fff; font-weight: bold; }

/* LOMAKE JA HAKU */
.form-section { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 30px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
.form-group { display: flex; flex-direction: column; }
.form-group label { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 4px; text-transform: uppercase; }
.form-group input { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; }
.search-wrapper { position: relative; width: 100%; max-width: 600px; margin-bottom: 15px; }
.search-box { width: 100%; padding: 16px 50px 16px 20px; font-size: 16px; border: 2px solid var(--hw-blue); border-radius: 50px; outline: none; }
.search-clear { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 22px; color: #aaa; cursor: pointer; background: none; border: none; }
.pkg-container { background: #fff9c4; border-radius: 12px; padding: 20px; border: 2px solid #fbc02d; margin-bottom: 30px; }
.pkg-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.pkg-btn { padding: 10px 18px; background: var(--hw-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

/* KORI */
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.cart-header { background: var(--hw-green); color: white; padding: 20px; text-align: center; font-weight: bold; }
.cart-item-list { flex: 1; overflow-y: auto; padding: 10px; }
.qty-area { display: flex; align-items: center; gap: 10px; }
.qty-btn { width: 34px; height: 34px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 18px; }
.qty-input { width: 40px; text-align: center; border: 1px solid #cbd5e0; padding: 6px; font-weight: bold; border-radius: 6px; }

/* YLÖS-NAPPI JA TILAUS-NAPPI */
#btnTop { position: fixed; bottom: 110px; right: 300px; background: var(--hw-blue); color: white; border: none; padding: 15px 25px; border-radius: 30px; display: none; z-index: 999; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
#btnViewCart { background: var(--hw-green); color: white; border: none; padding: 14px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-size: 15px; }

@media (max-width: 1100px) {
    .nav-sidebar, .cart-sidebar { position: fixed; left: -100%; top: 55px; z-index: 3000; width: 85%; height: calc(100vh - 55px); transition: 0.3s; }
    .cart-sidebar { right: -100%; left: auto; }
    .nav-sidebar.open { left: 0; }
    .cart-sidebar.open { right: 0; }
    .mobile-bar { display: flex; }
    #btnTop { right: 20px; }
    #btnViewCart { display: none; }
}
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--hw-blue)">Hartwall Varaosat</h2>
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="adminLoginPopup" style="display:none;">
    <div class="login-box">
        <h3>Ylläpito</h3>
        <input id="adminUser" placeholder="Tunnus">
        <input id="adminPass" type="password" placeholder="Salasana">
        <button onclick="doAdminLogin()" style="width:100%; padding:12px; background:var(--hw-dark); color:white; border:none; border-radius:6px; cursor:pointer;">KIRJAUDU</button>
        <button onclick="document.getElementById('adminLoginPopup').style.display='none'" style="margin-top:10px; color:red; cursor:pointer; background:none; border:none;">Peruuta</button>
    </div>
</div>

<div id="imgModal" onclick="this.style.display='none'">
    <span class="close-x">&times;</span>
    <img id="bigImg" class="modal-img-big">
</div>

<div id="viewCartModal" onclick="if(event.target==this)this.style.display='none'">
    <div class="modal-content">
        <span class="close-x" style="color:#999" onclick="document.getElementById('viewCartModal').style.display='none'">&times;</span>
        <h2 id="summary-main-title" style="color:var(--hw-green); margin-top:0;">Varaosatilaus</h2>
        <div id="summary-info" style="background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:15px; display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
        <div id="modal-cart-items" style="margin-bottom:30px; border:1px solid #eee; border-radius:8px;"></div>
        <button onclick="document.getElementById('viewCartModal').style.display='none'; finalSubmit();" style="width:100%; padding:18px; background:var(--hw-green); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
    </div>
</div>

<div id="pkgModal" onclick="if(event.target==this)this.style.display='none'">
    <div class="modal-content">
        <h3 id="pkgModalTitle" style="color:var(--hw-blue); margin-top:0;"></h3>
        <div id="pkgModalItems"></div>
        <button onclick="confirmPkgToCart()" style="width:100%; margin-top:20px; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">LISÄÄ KORIIN</button>
    </div>
</div>

<div id="relatedOverlay" onclick="if(event.target==this)this.style.display='none'">
    <div class="modal-content" style="width:450px;">
        <h3 style="color:var(--hw-blue); margin-top:0;">Suositellut lisäosat</h3>
        <div id="relatedContent"></div>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-bar">
        <button class="mobile-btn" onclick="toggleSidebar('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleSidebar('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">TUOTERYHMÄT</div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section">
                <div class="form-grid">
                    <div class="form-group"><label>Tilaaja *</label><input id="f_tilaaja" required></div>
                    <div class="form-group"><label>Varastonumero *</label><input id="f_varasto" required></div>
                    <div class="form-group"><label>Päivämäärä *</label><input id="f_pvm" type="date" required></div>
                    <div class="form-group"><label>Toimitustapa *</label><input id="f_tapa" required></div>
                    <div class="form-group"><label>Osoite *</label><input id="f_osoite" required></div>
                    <div class="form-group"><label>Postinumero *</label><input id="f_postinro" required></div>
                    <div class="form-group"><label>Paikkakunta *</label><input id="f_paikka" required></div>
                </div>
            </div>

            <div id="search-anchor" class="search-wrapper">
                <input id="filter" class="search-box" placeholder="Hae tuotteita..." oninput="render(this.value)">
                <button class="search-clear" onclick="clearSearch()">×</button>
            </div>

            <button id="btnViewCart" onclick="openCartModal()">🛒 TARKASTELE TILAUSTA (<span id="btn-cart-count">0</span>)</button>

            <div class="pkg-container">
                <div style="font-weight:bold; color:var(--hw-blue); margin-bottom:15px;">VALMIIT ASENNUSPAKETIT</div>
                <div class="pkg-grid" id="pkg-buttons"></div>
            </div>

            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div class="cart-header">OSTOSKORI (<span id="basket-count">0</span>)</div>
            <div id="basket-items" class="cart-item-list"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="finalSubmit()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
                <button onclick="document.getElementById('adminLoginPopup').style.display='flex'" style="width:100%; margin-top:10px; background:none; border:none; color:#a0aec0; font-size:10px; cursor:pointer;">YLLÄPITO</button>
            </div>
        </aside>
    </div>
</div>

<script>
const asennusPaketit = {
    "Kotipizza": [{code:"15490",qty:1},{code:"26520",qty:1},{code:"V00713",qty:5},{code:"V00726",qty:2},{code:"V02356",qty:1},{code:"V41800",qty:1},{code:"V02257",qty:1},{code:"V03010",qty:1},{code:"T00678",qty:5},{code:"T00723",qty:1},{code:"T41468",qty:2},{code:"T00384",qty:2},{code:"10172",qty:1},{code:"T41002",qty:2},{code:"T00609",qty:2},{code:"T41101",qty:2}],
    "Subway": [{code:"15279",qty:1},{code:"10160",qty:1},{code:"26520",qty:1},{code:"V00713",qty:4},{code:"V00726",qty:1},{code:"V00727",qty:1},{code:"V02356",qty:1},{code:"V41800",qty:1},{code:"V02257",qty:1},{code:"V03010",qty:1},{code:"T00678",qty:4},{code:"T00723",qty:1},{code:"T41468",qty:2},{code:"T00384",qty:2},{code:"T41002",qty:2},{code:"T00609",qty:2},{code:"T41101",qty:2}],
    "LD HIGHTOWER TISKIN ALLE": [{code:"19814",qty:1},{code:"30105",qty:1},{code:"V02013",qty:3},{code:"T02223",qty:3},{code:"T02222",qty:3},{code:"T41460",qty:3},{code:"T41469",qty:3},{code:"V02355",qty:1},{code:"V03010",qty:1},{code:"V02257",qty:1},{code:"T00609",qty:1},{code:"T41101",qty:1},{code:"T41002",qty:1},{code:"M01285",qty:1},{code:"M01290",qty:1},{code:"M01296",qty:1}]
};
const relatedItems = {
    "V02363": ["V03010","V02257","V02351","T00457","T02256","T41430"],
    "V02355": ["V03010","V02257","V02351","T00457","T02256","T41430"],
    "V02356": ["V03010","V02257","V02351","T00457","T02256","T41430"],
    "V02340": ["V03010","V02257","V02351","T00457","T02256","T41430"],
    "V02351": ["V03010","V02257","V02351","T00457","T02256","T41430"],
    "V02364": ["V03010","V02257","V02351","T00457","T02256","T41430"]
};
const sallitut = {"tomppa":"Tomi7122","markku":"parkinson","jaakko":"vendingjaska","dan":"huoltodan","tommi":"nappie","samia":"koksmeny","bob":"nayri","jouni":"paju1","jussi":"paukku","sami":"ruoska","jarno":"kurnu"};

let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; let currentPkgItems = [];

window.onscroll = () => { document.getElementById("btnTop").style.display = window.scrollY > 400 ? "block" : "none"; };

function openBigImg(code) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModal").style.display = 'flex';
}

function doAppLogin() {
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadLocalStock(); loadFiles();
    } else { alert("Virhe!"); }
}

function doAdminLogin() {
    if (document.getElementById("adminUser").value === "admin" && document.getElementById("adminPass").value === "hartwall") {
        document.getElementById("adminLoginPopup").style.display = "none";
        alert("Ylläpito-ominaisuudet käytössä.");
    } else { alert("Virhe!"); }
}

async function loadFiles() {
    try {
        const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
        if(r1.ok) {
            const t = await r1.text();
            let cur = null;
            t.split("\n").forEach(line => {
                let s = line.trim(); if(!s) return;
                if(!/\d/.test(s.split(" ")[0])) { cur = s; allData[cur] = []; }
                else if(cur) { allData[cur].push({code: s.split(" ")[0], name: s.substring(s.split(" ")[0].length).trim()}); }
            });
        }
        if(r2.ok) {
            const t = await r2.text();
            let curM = null;
            t.split("\n").forEach(l => {
                let s = l.trim(); if(!s) return;
                if(l.startsWith("-")) { if(curM) curM.subs.push(s.substring(1)); }
                else { curM = {name: s, subs: []}; categories.push(curM); }
            });
        }
        renderPkgs(); renderNav(); render();
    } catch(e) { console.error(e); }
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            let block = document.createElement("div"); block.id = sub;
            let hasVisible = false;
            filt.forEach(p => {
                hasVisible = true;
                block.innerHTML += `
                    <div class="product-item">
                        <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}')">
                        <div class="product-info" onclick="openBigImg('${p.code}')">
                            <b>${p.name}</b><br><small>${p.code}</small>
                        </div>
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',-1)">-</button>
                            <input class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" readonly>
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',1)">+</button>
                        </div>
                    </div>`;
            });
            if (hasVisible) {
                let title = document.createElement("div");
                title.style = "background:var(--hw-blue); color:white; padding:12px; margin:20px 0 10px 0; border-radius:8px; font-weight:bold;";
                title.innerText = sub;
                list.appendChild(title); list.appendChild(block);
            }
        });
    });
}

function updateQty(code, name, delta, skipRelated = false) {
    if(!cart[code]) {
        if(!name) { for(let c in allData) { let p = allData[c].find(x => x.code === code); if(p) name = p.name; } }
        cart[code] = { code, name: name || "Tuote " + code, qty: 0 };
    }
    if(delta > 0 && relatedItems[code] && !skipRelated) openRelatedPopup(code);
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    let el = document.getElementById("q_"+code); if(el) el.value = cart[code]?.qty || 0;
    renderCart();
}

function openCartModal() {
    const modal = document.getElementById("viewCartModal");
    const content = document.getElementById("modal-cart-items");
    const info = document.getElementById("summary-info");
    
    info.innerHTML = `
        <div><b>Tilaaja:</b> ${document.getElementById("f_tilaaja").value || '-'}</div>
        <div><b>Varasto:</b> ${document.getElementById("f_varasto").value || '-'}</div>
        <div><b>Pvm:</b> ${document.getElementById("f_pvm").value || '-'}</div>
        <div><b>Toimitus:</b> ${document.getElementById("f_tapa").value || '-'}</div>
    `;

    content.innerHTML = "";
    Object.values(cart).forEach(i => {
        content.innerHTML += `<div style="padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;"><div><b>${i.code}</b><br>${i.name}</div><div class="qty-area"><button class="qty-btn" onclick="updateQty('${i.code}','${i.name}',-1); openCartModal();">-</button><input class="qty-input" value="${i.qty}" readonly><button class="qty-btn" onclick="updateQty('${i.code}','${i.name}',1); openCartModal();">+</button></div></div>`;
    });
    modal.style.display = "flex";
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    Object.values(cart).forEach(i => {
        div.innerHTML += `<div class="cart-item"><div style="font-weight:bold; margin-bottom:10px; font-size:13px;">${i.code} - ${i.name}</div><div class="qty-area" style="justify-content:flex-end; border-top:1px solid #f0f0f0; padding-top:10px;"><button class="qty-btn" style="width:28px; height:28px;" onclick="updateQty('${i.code}','${i.name}',-1)">-</button><input class="qty-input" style="width:35px; padding:5px;" value="${i.qty}" readonly><button class="qty-btn" style="width:28px; height:28px;" onclick="updateQty('${i.code}','${i.name}',1)">+</button></div></div>`;
    });
    const total = Object.values(cart).length;
    document.getElementById("basket-count").textContent = total;
    document.getElementById("m-count").textContent = total;
    document.getElementById("btn-cart-count").textContent = total;
}

function clearSearch() { document.getElementById("filter").value = ""; render(""); }
function scrollToSearch() { window.scrollTo({ top: 350, behavior: 'smooth' }); }
function toggleSidebar(id) { document.getElementById(id).classList.toggle('open'); }
function jumpTo(id) { const el = document.getElementById(id); if(el) { el.scrollIntoView({behavior:"smooth"}); document.getElementById("nav-sidebar").classList.remove("open"); } }
function renderPkgs() { const div = document.getElementById("pkg-buttons"); div.innerHTML = ""; Object.keys(asennusPaketit).forEach(name => { div.innerHTML += `<button class="pkg-btn" onclick="openPkgModal('${name}')">${name}</button>`; }); }
function openPkgModal(name) { const modal = document.getElementById("pkgModal"); const content = document.getElementById("pkgModalItems"); document.getElementById("pkgModalTitle").innerText = name; content.innerHTML = ""; currentPkgItems = JSON.parse(JSON.stringify(asennusPaketit[name])); currentPkgItems.forEach((item, index) => { let n = "Tuote " + item.code; for(let c in allData) { let f = allData[c].find(x => x.code === item.code); if(f) n = f.name; } content.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee;"><div><b>${item.code}</b><br>${n}</div><div class="qty-area"><button class="qty-btn" onclick="updatePkgItemQty(${index},-1)">-</button><input class="qty-input" value="${item.qty}" readonly><button class="qty-btn" onclick="updatePkgItemQty(${index},1)">+</button></div></div>`; }); modal.style.display = "flex"; }
function updatePkgItemQty(idx, d) { currentPkgItems[idx].qty += d; if(currentPkgItems[idx].qty < 0) currentPkgItems[idx].qty = 0; document.querySelectorAll("#pkgModalItems .qty-input")[idx].value = currentPkgItems[idx].qty; }
function confirmPkgToCart() { currentPkgItems.forEach(i => { if(i.qty > 0) updateQty(i.code, "", i.qty, true); }); document.getElementById("pkgModal").style.display = "none"; }
function openRelatedPopup(parentCode) { const content = document.getElementById("relatedContent"); content.innerHTML = ""; relatedItems[parentCode].forEach(relCode => { let relName = "Tuote " + relCode; for (let cat in allData) { let p = allData[cat].find(x => x.code === relCode); if (p) { relName = p.name; break; } } content.innerHTML += `<div class="related-item"><div style="flex:1;"><b>${relCode}</b><br>${relName}</div><button onclick="updateQty('${relCode}', '${relName}', 1, true)" style="background:var(--hw-green); color:white; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">Lisää</button></div>`; }); document.getElementById("relatedOverlay").style.display = "flex"; }
function loadLocalStock() { try { const r = localStorage.getItem("stockStatus"); if(r) stockStatus = JSON.parse(r); } catch(e){} }
function finalSubmit() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value, p: document.getElementById("f_pvm").value, tapa: document.getElementById("f_tapa").value, o: document.getElementById("f_osoite").value, n: document.getElementById("f_postinro").value, k: document.getElementById("f_paikka").value };
    if(!f.t || !f.v || !f.p || !f.tapa || !f.o || !f.n || !f.k) return alert("Täytä kaikki tiedot!");
    const subject = `Varaosatilaus - ${f.t} - ${f.v}`;
    let body = `Tilaaja: ${f.t}\nVarastonumero: ${f.v}\nPäivämäärä: ${f.p}\nToimitustapa: ${f.tapa}\nOsoite: ${f.o}, ${f.n} ${f.k}\n\nTUOTTEET:\n`;
    Object.values(cart).forEach(i => { body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`; });
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
