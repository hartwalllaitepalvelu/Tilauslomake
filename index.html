<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus Pro</title>
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --sidebar-w: 280px; }
body { font-family:'Segoe UI', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* Z-INDEX HALLINTA */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,45,147,0.8); display:flex; justify-content:center; align-items:center; z-index:100001; }
#pkgModal, #imgModal, #relatedOverlay, #viewCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; }

.login-box { background:white; padding:40px; border-radius:12px; width:340px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.4); }
.login-box input { width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }

.app-container { display: flex; min-height: 100vh; }
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.nav-header { background: var(--hw-dark); color: white; padding: 20px; font-weight: bold; font-size: 16px; }
.nav-item { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
.nav-sub-list { display: none; background: #fafafa; padding-bottom: 10px; }
.nav-item.active .nav-sub-list { display: block; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* TUOTEKORTIT (GRID) */
.product-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
    gap: 20px; 
    padding: 10px 0;
}

.product-card { 
    background: white; 
    border-radius: 12px; 
    padding: 15px; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    text-align: center;
    border: 1px solid #e1e4e8;
    transition: transform 0.2s;
}
.product-card:hover { transform: translateY(-5px); }
.product-card.out { opacity: 0.5; background: #f0f0f0; }

.thumb-img { width: 120px; height: 120px; object-fit: contain; background: white; border-radius: 8px; cursor: zoom-in; margin-bottom: 10px; }

.qty-area { display: flex; align-items: center; gap: 8px; margin-top: auto; width: 100%; justify-content: center; }
.qty-btn { width: 32px; height: 32px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.qty-input { width: 40px; text-align: center; border: 1px solid #cbd5e0; padding: 6px; font-weight: bold; border-radius: 6px; }

.category-title { background: var(--hw-blue); color: white; padding: 12px; margin: 30px 0 15px 0; border-radius: 8px; font-weight: bold; width: 100%; box-sizing: border-box; }

.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.cart-header { background: var(--hw-green); color: white; padding: 20px; text-align: center; font-weight: bold; }
.cart-item-list { flex: 1; overflow-y: auto; padding: 10px; }
.cart-item { padding: 15px; border: 1px solid #eee; background: white; border-radius: 10px; margin: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

#btnTop { position: fixed; bottom: 30px; right: 300px; background: var(--hw-blue); color: white; border: none; padding: 15px 25px; border-radius: 30px; display: none; z-index: 999; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

#adminSection { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2d3748; color: white; padding: 15px; z-index: 50000; box-sizing: border-box; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; }
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--hw-blue)">Hartwall Varaosat</h2>
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="app-container">
        <nav class="nav-sidebar">
            <div class="nav-header">TUOTERYHMÄT</div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section" style="background:white; padding:25px; border-radius:12px; border:1px solid #e1e4e8; margin-bottom:30px;">
                <div class="form-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
                    <input id="f_tilaaja" placeholder="Tilaaja *">
                    <input id="f_varasto" placeholder="Varasto *">
                    <input id="f_pvm" type="date">
                    <input id="f_tapa" placeholder="Toimitustapa">
                </div>
            </div>

            <input id="filter" style="width:100%; padding:16px 20px; font-size:16px; border:2px solid var(--hw-blue); border-radius:50px; margin-bottom:20px;" placeholder="Hae tuotteita..." oninput="render(this.value)">

            <div style="background:#fff9c4; padding:20px; border-radius:12px; border:2px solid #fbc02d; margin-bottom:30px;">
                <div style="font-weight:bold; margin-bottom:10px; color:var(--hw-blue);">VALMIIT ASENNUSPAKETIT</div>
                <div id="pkg-buttons" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
            </div>

            <div id="main-list"></div>
        </main>

        <aside class="cart-sidebar">
            <div class="cart-header">OSTOSKORI (<span id="basket-count">0</span>)</div>
            <div id="basket-items" class="cart-item-list"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="finalSubmit()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
            </div>
        </aside>
    </div>
</div>

<div id="pkgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content" style="background:white; padding:40px; border-radius:16px; width:600px; margin:auto; position:relative; top:50px;"><h3 id="pkgModalTitle"></h3><div id="pkgModalItems"></div><button onclick="confirmPkgToCart()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; margin-top:15px;">LISÄÄ KORIIN</button></div></div>
<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content" style="background:white; padding:40px; border-radius:16px; width:600px; margin:auto; position:relative; top:50px;"><h3 id="imgModalTitle"></h3><img id="bigImg" style="width:100%; border-radius:8px;"></div></div>
<div id="relatedOverlay" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content" style="background:white; padding:30px; border-radius:16px; width:450px; margin:auto; position:relative; top:50px;"><h3 style="color:var(--hw-blue)">Suositellut lisäosat</h3><div id="relatedContent"></div></div></div>

<script>
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; 
let asennusPaketit = {}; let relatedItems = {}; let sallitut = {};
let currentPkgItems = [];

async function doAppLogin() {
    await loadUsers();
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadAllData();
    } else { alert("Virhe käyttäjätunnuksessa tai salasanassa!"); }
}

async function loadUsers() {
    try {
        const res = await fetch("käyttäjät.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const p = line.trim().split(/\s+/);
                if(p.length >= 2) sallitut[p[0].toLowerCase()] = p[1];
            });
        }
    } catch(e) {}
}

async function loadAllData() {
    await Promise.all([loadFiles(), loadStockStatus(), loadRecommendations(), loadPackages()]);
}

async function loadStockStatus() {
    try {
        const res = await fetch("varastotilanne.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const p = line.trim().split(";");
                if(p.length >= 4) stockStatus[p[0]] = { outOfStock: p[1] === "true", hidden: p[2] === "true", eta: p[3] };
            });
            render();
        }
    } catch(e) {}
}

async function loadRecommendations() {
    try {
        const res = await fetch("suositukset.txt");
        if(res.ok) {
            const t = await res.text();
            let parent = null;
            t.split("\n").forEach(line => {
                const s = line.trim(); if(!s) return;
                const p = s.split(/\s+/);
                if(p.length === 1) { parent = p[0]; relatedItems[parent] = []; }
                else if(parent) { relatedItems[parent].push(p[0]); }
            });
        }
    } catch(e) {}
}

async function loadPackages() {
    try {
        const res = await fetch("asennuspaketit.txt");
        if(res.ok) {
            const t = await res.text();
            let name = null;
            t.split("\n").forEach(line => {
                const s = line.trim(); if(!s) return;
                if(!/\d/.test(s.split(" ")[0])) { name = s; asennusPaketit[name] = []; }
                else if(name) {
                    const p = s.split(/\s+/);
                    asennusPaketit[name].push({ code: p[0], qty: parseInt(p[p.length-1]) || 1 });
                }
            });
            renderPkgs();
        }
    } catch(e) {}
}

async function loadFiles() {
    try {
        const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
        if(r1.ok) {
            const t = await r1.text(); let cur = null;
            t.split("\n").forEach(line => {
                let s = line.trim(); if(!s) return;
                if(!/\d/.test(s.split(" ")[0])) { cur = s; allData[cur] = []; }
                else if(cur) {
                    const code = s.split(" ")[0];
                    allData[cur].push({code: code, name: s.substring(code.length).trim()});
                }
            });
        }
        if(r2.ok) {
            const t = await r2.text(); let curM = null;
            t.split("\n").forEach(l => {
                let s = l.trim(); if(!s) return;
                if(l.startsWith("-")) { if(curM) curM.subs.push(s.substring(1)); }
                else { curM = {name: s, subs: []}; categories.push(curM); }
            });
        }
        renderNav(); render();
    } catch(e) {}
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) return;
            let title = document.createElement("div"); title.className = "category-title"; title.innerText = sub;
            list.appendChild(title);
            let grid = document.createElement("div"); grid.className = "product-grid";
            filt.forEach(p => {
                let s = stockStatus[p.code] || {}; if (s.hidden) return;
                grid.innerHTML += `
                    <div class="product-card ${s.outOfStock ? 'out' : ''}">
                        <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}','${p.name}')">
                        <div style="font-weight:bold; font-size:13px; margin-bottom:5px; height:34px; overflow:hidden;">${p.name}</div>
                        <div style="font-size:11px; color:#666; margin-bottom:10px;">${p.code}</div>
                        ${s.outOfStock ? `<div style="color:red; font-size:10px; font-weight:bold;">LOPPU! ${s.eta ? 'ETA: '+s.eta : ''}</div>` : ''}
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',-1)">-</button>
                            <input class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" readonly>
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',1)">+</button>
                        </div>
                    </div>`;
            });
            list.appendChild(grid);
        });
    });
}

function updateQty(code, name, delta, skipRelated = false) {
    if(!cart[code]) cart[code] = { code, name, qty: 0 };
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    if(delta > 0 && relatedItems[code] && !skipRelated) openRelatedPopup(code);
    renderCart();
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    Object.values(cart).forEach(i => { div.innerHTML += `<div class="cart-item"><b>${i.code}</b><br>${i.name}<br>Määrä: ${i.qty}</div>`; });
    document.getElementById("basket-count").innerText = Object.values(cart).length;
}

function renderPkgs() {
    const div = document.getElementById("pkg-buttons"); div.innerHTML = "";
    Object.keys(asennusPaketit).forEach(name => {
        div.innerHTML += `<button style="padding:10px 15px; background:var(--hw-blue); color:white; border:none; border-radius:8px; cursor:pointer;" onclick="openPkgModal('${name}')">${name}</button>`;
    });
}

function openPkgModal(name) {
    const items = document.getElementById("pkgModalItems"); items.innerHTML = "";
    document.getElementById("pkgModalTitle").innerText = name;
    currentPkgItems = asennusPaketit[name];
    currentPkgItems.forEach(item => {
        let n = "Tuote " + item.code;
        for(let cat in allData) { let f = allData[cat].find(x => x.code === item.code); if(f) n = f.name; }
        items.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">${n} (${item.code}) - ${item.qty} kpl</div>`;
    });
    document.getElementById("pkgModal").style.display = "flex";
}

function confirmPkgToCart() {
    currentPkgItems.forEach(i => {
        let n = "Tuote " + i.code;
        for(let cat in allData) { let f = allData[cat].find(x => x.code === i.code); if(f) n = f.name; }
        updateQty(i.code, n, i.qty, true);
    });
    document.getElementById("pkgModal").style.display = "none";
}

function openRelatedPopup(parentCode) {
    const content = document.getElementById("relatedContent"); content.innerHTML = "";
    relatedItems[parentCode].forEach(relCode => {
        let relName = "Tuote " + relCode;
        for (let cat in allData) { let p = allData[cat].find(x => x.code === relCode); if (p) { relName = p.name; break; } }
        content.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;"><div><b>${relCode}</b><br>${relName}</div><button onclick="updateQty('${relCode}', '${relName}', 1, true)" style="background:var(--hw-green); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Lisää</button></div>`;
    });
    document.getElementById("relatedOverlay").style.display = "flex";
}

function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let div = document.createElement("div"); div.className = "nav-item";
        div.innerHTML = `<div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} <span>▾</span></div>`;
        let subDiv = document.createElement("div"); subDiv.className = "nav-sub-list";
        c.subs.forEach(s => { 
            let item = document.createElement("div"); item.style = "padding:10px 20px; cursor:pointer;"; item.innerText = s; 
            item.onclick = () => { 
                const safeId = "cat-" + s.replace(/\s+/g, '-').toLowerCase();
                document.getElementById(safeId)?.scrollIntoView({behavior:"smooth"});
            };
            subDiv.appendChild(item);
        });
        div.appendChild(subDiv); nav.appendChild(div);
    });
}

function openBigImg(code, name) { 
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = code + " - " + name;
    document.getElementById("imgModal").style.display = "flex";
}

function finalSubmit() {
    const t = document.getElementById("f_tilaaja").value;
    if(!t) return alert("Tilaajan nimi puuttuu!");
    let body = `Tilaaja: ${t}\nTuotteet:\n`;
    Object.values(cart).forEach(i => { body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`; });
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus - ${t}&body=${encodeURIComponent(body)}`;
}
</script>

</body>
</html>
