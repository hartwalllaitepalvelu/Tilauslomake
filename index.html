<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --hw-blue:#004593; --hw-dark:#002d62; --hw-green:#28a745; --sidebar-w: 280px; }
body { font-family:'Inter', sans-serif; margin:0; background:#f4f7f9; font-size:14px; color:#333; padding-bottom: 120px; }

/* MODALS */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,45,147,0.8); display:flex; justify-content:center; align-items:center; z-index:100001; }
#pkgModal, #imgModal, #relatedOverlay, #fullCartModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; justify-content:center; align-items:center; }

.app-container { display: flex; min-height: 100vh; }

/* SIDEBARS */
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease; z-index: 15000; }
.cart-sidebar { width: var(--sidebar-w); background: white; border-left: 1px solid #ddd; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 15000; }

.nav-header { background: var(--hw-dark); color: white; padding: 20px; font-weight: bold; font-size: 14px; text-align: center; }
.nav-group { border-bottom: 1px solid #eee; }
.nav-main-cat { padding: 12px 15px; font-weight: 700; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.nav-sub-list { display: none; background: white; }
.nav-group.active .nav-sub-list { display: block; }
.nav-sub-item { padding: 8px 15px 8px 30px; cursor: pointer; border-bottom: 1px solid #f9f9f9; color: #555; }

.main-content { flex: 1; padding: 20px; min-width: 0; }

/* MOBIILIPALKKI */
.mobile-top-bar { display: none; background: var(--hw-dark); padding: 10px; position: sticky; top: 0; z-index: 16000; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.mobile-btn { flex: 1; padding: 10px; background: var(--hw-blue); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }

/* TUOTEKORTIT */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 10px 0; }
.product-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border: 1px solid #e1e4e8; transition: all 0.2s; }
.product-card.in-cart { border: 2px solid var(--hw-green); background: #f0fff4; }
.product-card.out { opacity: 0.6; filter: grayscale(0.5); }
.thumb-img { width: 100px; height: 100px; object-fit: contain; background: white; cursor: zoom-in; margin-bottom: 10px; }

.qty-area { display: flex; align-items: center; gap: 5px; margin-top: auto; width: 100%; justify-content: center; }
.qty-btn { width: 32px; height: 32px; border: none; background: #edf2f7; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.qty-input { width: 35px; text-align: center; border: 1px solid #cbd5e0; padding: 5px; font-weight: bold; border-radius: 6px; }

.search-container { position: relative; margin-bottom: 20px; }
#filter { width: 100%; padding: 14px 45px 14px 20px; font-size: 15px; border: 2px solid var(--hw-blue); border-radius: 50px; box-sizing: border-box; }
#clearSearch { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 20px; color: #999; cursor: pointer; display: none; }

.form-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 20px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.form-grid input, .form-grid textarea { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; width: 100%; box-sizing: border-box; }

#adminSection { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2d3748; color: white; padding: 15px; z-index: 50000; box-sizing: border-box; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; }
#btnTop { position: fixed; bottom: 30px; right: 300px; background: var(--hw-blue); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; display: none; z-index: 9999; font-weight: bold; cursor: pointer; font-size: 20px; }

.login-box { text-align: center; background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 320px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; box-sizing: border-box; }

@media (max-width: 900px) {
    .mobile-top-bar { display: flex; }
    .nav-sidebar { position: fixed; left: 0; transform: translateX(-100%); }
    .nav-sidebar.open { transform: translateX(0); }
    .cart-sidebar { position: fixed; right: 0; transform: translateX(100%); }
    .cart-sidebar.open { transform: translateX(0); }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    #btnTop { right: 20px; }
}

.modal-content { background:white; padding:30px; border-radius:16px; width:750px; max-width:95%; max-height:85vh; overflow-y:auto; position: relative; }
.close-x { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <img src="392px-Hartwallin_logo.svg.png" alt="Hartwall Logo" style="width: 100%; max-width: 240px; margin-bottom: 25px;">
        <input id="uField" placeholder="Käyttäjätunnus">
        <input id="pField" type="password" placeholder="Salasana">
        <button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-dark); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button>
    </div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="mobile-top-bar">
        <button class="mobile-btn" onclick="toggleSidebar('nav-sidebar')">☰ VALIKKO</button>
        <button class="mobile-btn" onclick="toggleSidebar('cart-sidebar')">🛒 KORI (<span id="m-count">0</span>)</button>
    </div>

    <div class="app-container">
        <nav id="nav-sidebar" class="nav-sidebar">
            <div class="nav-header">
                <img src="392px-Hartwallin_logo.svg.png" style="width:130px; filter: brightness(0) invert(1); margin-bottom:10px;"><br>
                VARAOSAT
            </div>
            <div id="dynamic-nav"></div>
        </nav>

        <main class="main-content">
            <div class="form-section">
                <div class="form-grid">
                    <input id="f_tilaaja" placeholder="Tilaaja *" required>
                    <input id="f_varasto" placeholder="Varastonumero *" required>
                    <input id="f_pvm" type="date" required>
                    <input id="f_tapa" placeholder="Toimitustapa *" required>
                    <input id="f_osoite" placeholder="Osoite *" required>
                    <input id="f_postinro" placeholder="Postinumero *" required>
                    <input id="f_paikka" placeholder="Paikkakunta *" required>
                    <textarea id="f_lisatiedot" placeholder="Lisätietoja..." style="grid-column: 1 / -1; height: 60px;"></textarea>
                    <textarea id="f_puuttuvat" placeholder="Listalta puuttuvat tuotteet: Lisää nimi ja kappalemäärä" style="grid-column: 1 / -1; height: 60px; color: #666;"></textarea>
                </div>
            </div>

            <div class="search-container">
                <input id="filter" placeholder="Hae tuotteita..." oninput="handleSearch(this.value)">
                <button id="clearSearch" onclick="resetSearch()">✕</button>
            </div>

            <div style="background:#fff9c4; padding:20px; border-radius:12px; border:2px solid #fbc02d; margin-bottom:30px;">
                <div style="font-weight:bold; margin-bottom:10px; color:var(--hw-blue);">VALMIIT ASENNUSPAKETIT</div>
                <div id="pkg-buttons" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
            </div>

            <div id="main-list"></div>
        </main>

        <aside id="cart-sidebar" class="cart-sidebar">
            <div class="cart-header" style="background:var(--hw-green); color:white; padding:20px; text-align:center; font-weight:bold;">OSTOSKORI (<span id="basket-count">0</span>) <span onclick="toggleSidebar('cart-sidebar')" style="float:right; cursor:pointer; font-size:20px;">✕</span></div>
            <div id="basket-items" style="flex:1; overflow-y:auto; padding:10px;"></div>
            <div style="padding:15px; border-top:1px solid #eee;">
                <button onclick="openFullCart()" style="width:100%; padding:14px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px;">TARKASTELE OSTOSKORIA JA LÄHETÄ TILAUS</button>
                <button onclick="document.getElementById('adminLoginPopup').style.display='flex'" style="width:100%; margin-top:10px; background:none; border:none; color:#94a3b8; font-size:10px; cursor:pointer;">YLLÄPITO</button>
            </div>
        </aside>
    </div>
</div>

<div id="adminSection">
    <input id="adminCode" placeholder="Koodi" style="padding:8px; width:100px;">
    <label><input type="checkbox" id="adminOutOfStock"> LOPPU</label>
    <label><input type="checkbox" id="adminHide"> PIILOTA</label>
    <input id="adminETA" placeholder="ETA">
    <button onclick="saveStockStatus()" style="padding:8px 15px; background:var(--hw-green); color:white; border-radius:4px;">TALLENNA</button>
    <button onclick="document.getElementById('adminSection').style.display='none'" style="color:red; background:none; border:none;">SULJE X</button>
</div>

<div id="fullCartModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('fullCartModal').style.display='none'">&times;</span><h2 style="color:var(--hw-green)">Tilausyhteenveto</h2><div id="fullCartInfo" style="margin-bottom:20px; padding:15px; background:#f9f9f9; border-radius:10px; line-height:1.6;"></div><div id="fullCartItems"></div><button onclick="finalSubmit()" style="width:100%; padding:20px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; font-size:16px; margin-top:20px; cursor:pointer;">VAHVISTA JA LÄHETÄ TILAUS</button></div></div>
<div id="pkgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('pkgModal').style.display='none'">&times;</span><h3 id="pkgModalTitle"></h3><div id="pkgModalItems"></div><button onclick="confirmPkgToCart()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:8px; font-weight:bold; margin-top:15px;">LISÄÄ KAIKKI KORIIN</button></div></div>
<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span class="close-x" onclick="document.getElementById('imgModal').style.display='none'">&times;</span><h3 id="imgModalTitle"></h3><img id="bigImg" style="width:100%; max-height:50vh; object-fit:contain;"><div id="guideLinks"></div></div></div>
<div id="relatedOverlay" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content" style="width:400px;"><h3>Suositellut lisäosat</h3><div id="relatedContent"></div></div></div>
<div id="adminLoginPopup" style="display:none;"><div class="login-box"><h3>Ylläpito</h3><input id="adminUser" placeholder="Tunnus"><input id="adminPass" type="password" placeholder="Salasana"><button onclick="doAdminLogin()" style="width:100%; padding:12px; background:var(--hw-dark); color:white; border:none; border-radius:6px;">KIRJAUDU</button></div></div>

<button onclick="window.scrollTo({top:0, behavior:'smooth'})" id="btnTop">↑</button>

<script>
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; 
let asennusPaketit = {}; let relatedItems = {}; let sallitut = {};
let currentPkgItems = []; let isAdmin = false;

window.onscroll = () => { document.getElementById("btnTop").style.display = window.scrollY > 300 ? "block" : "none"; };

async function doAppLogin() {
    await loadUsers();
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (sallitut[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadAllData();
    } else { alert("Virhe!"); }
}

async function loadUsers() {
    try {
        const res = await fetch("käyttäjät.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const p = line.trim().split(/\s+/);
                if(p.length >= 2) sallitut[p[0].toLowerCase()] = p[1];
            });
        }
    } catch(e) {}
}

async function loadAllData() {
    await Promise.all([loadFiles(), loadStockStatus(), loadRecommendations(), loadPackages()]);
}

async function loadStockStatus() {
    try {
        const res = await fetch("varastotilanne.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(line => {
                const p = line.trim().split(";");
                if(p.length >= 4) stockStatus[p[0]] = { outOfStock: p[1] === "true", hidden: p[2] === "true", eta: p[3] };
            });
            render();
        }
    } catch(e) {}
}

async function loadRecommendations() {
    try {
        const res = await fetch("suositukset.txt");
        if(res.ok) {
            const t = await res.text();
            let parent = null;
            t.split("\n").forEach(line => {
                const s = line.trim(); if(!s) return;
                const p = s.split(/\s+/);
                if(p.length === 1) { parent = p[0]; relatedItems[parent] = []; }
                else if(parent) { relatedItems[parent].push(p[0]); }
            });
        }
    } catch(e) {}
}

async function loadPackages() {
    try {
        const res = await fetch("asennuspaketit.txt");
        if(res.ok) {
            const t = await res.text();
            let name = null;
            asennusPaketit = {};
            t.split("\n").forEach(line => {
                const s = line.trim(); if(!s) return;
                const parts = s.split(/\s+/);
                // Jos rivillä on vain yksi osa (tai se on selvästi nimi), se on paketin nimi
                if(parts.length === 1 || (parts.length > 1 && isNaN(parts[parts.length-1]))) { 
                    name = s; asennusPaketit[name] = []; 
                } 
                // Jos rivillä on koodi ja numero lopussa, se on tuote
                else if(name && parts.length >= 2) {
                    asennusPaketit[name].push({ 
                        code: parts[0], 
                        qty: parseInt(parts[parts.length-1]) || 1 
                    });
                }
            });
            renderPkgs();
        }
    } catch(e) {}
}

async function loadFiles() {
    try {
        const [r1, r2] = await Promise.all([fetch("data.txt"), fetch("kategoriat.txt")]);
        if(r1.ok) {
            const t = await r1.text(); let cur = null;
            t.split("\n").forEach(line => {
                let s = line.trim(); if(!s) return;
                if(!/\d/.test(s.split(" ")[0])) { cur = s; allData[cur] = []; }
                else if(cur) {
                    const code = s.split(" ")[0];
                    allData[cur].push({code: code, name: s.substring(code.length).trim()});
                }
            });
        }
        if(r2.ok) {
            const t = await r2.text(); let curM = null;
            t.split("\n").forEach(l => {
                let s = l.trim(); if(!s) return;
                if(!l.startsWith("-")) { 
                    curM = {name: s, subs: []}; categories.push(curM); 
                } else {
                    if(curM) curM.subs.push(s.substring(1).trim());
                }
            });
        }
        renderNav(); render();
    } catch(e) {}
}

function findNameByCode(code) {
    for (let cat in allData) {
        let found = allData[cat].find(x => x.code === code);
        if (found) return found.name;
    }
    return code;
}

function handleSearch(val) {
    document.getElementById("clearSearch").style.display = val ? "block" : "none";
    render(val);
}

function resetSearch() {
    document.getElementById("filter").value = "";
    handleSearch("");
}

function toggleSidebar(id) {
    const sidebar = document.getElementById(id);
    sidebar.classList.toggle('open');
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) return;
            let title = document.createElement("div"); title.className = "category-title"; title.innerText = sub; title.id = "cat-" + sub.replace(/\s+/g, '-').toLowerCase();
            list.appendChild(title);
            let grid = document.createElement("div"); grid.className = "product-grid";
            filt.forEach(p => {
                let s = stockStatus[p.code] || {}; if (s.hidden && !isAdmin) return;
                let inCartClass = cart[p.code] ? 'in-cart' : '';
                grid.innerHTML += `
                    <div class="product-card ${s.outOfStock ? 'out' : ''} ${inCartClass}" id="card_${p.code}">
                        <img class="thumb-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='" onclick="openBigImg('${p.code}','${p.name}')">
                        <div style="font-weight:bold; font-size:13px; margin-bottom:5px; height:34px; overflow:hidden;">${p.name}</div>
                        <div style="font-size:11px; color:#666; margin-bottom:10px;">${p.code}</div>
                        ${s.outOfStock ? `<div style="color:red; font-size:10px; font-weight:bold;">LOPPU! ${s.eta ? 'ETA: '+s.eta : ''}</div>` : ''}
                        <div class="qty-area">
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',-1)">-</button>
                            <input class="qty-input" id="q_${p.code}" value="${cart[p.code]?.qty || 0}" readonly>
                            <button class="qty-btn" onclick="updateQty('${p.code}','${p.name}',1)">+</button>
                        </div>
                    </div>`;
            });
            list.appendChild(grid);
        });
    });
}

function updateQty(code, name, delta, skipRelated = false) {
    if(!cart[code]) {
        if(!name) name = findNameByCode(code);
        cart[code] = { code, name, qty: 0 };
    }
    cart[code].qty += delta;
    if(cart[code].qty <= 0) {
        delete cart[code];
        document.getElementById("card_"+code)?.classList.remove("in-cart");
    } else {
        document.getElementById("card_"+code)?.classList.add("in-cart");
    }
    if(delta > 0 && relatedItems[code] && !skipRelated) openRelatedPopup(code);
    renderCart();
    const el = document.getElementById("q_"+code); if(el) el.value = cart[code]?.qty || 0;
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    Object.values(cart).forEach(i => {
        div.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">
            <b>${i.code}</b><br>${i.name}<br>
            <div class="qty-area" style="margin-top:5px; justify-content:flex-start;">
                <button class="qty-btn" onclick="updateQty('${i.code}','${i.name}',-1)">-</button>
                <input class="qty-input" value="${i.qty}" readonly>
                <button class="qty-btn" onclick="updateQty('${i.code}','${i.name}',1)">+</button>
            </div>
        </div>`;
    });
    const count = Object.values(cart).length;
    document.getElementById("basket-count").innerText = count;
    document.getElementById("m-count").innerText = count;
}

function openFullCart() {
    const info = document.getElementById("fullCartInfo");
    const items = document.getElementById("fullCartItems");
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value, o: document.getElementById("f_osoite").value, p: document.getElementById("f_postinro").value, k: document.getElementById("f_paikka").value, l: document.getElementById("f_lisatiedot").value };
    info.innerHTML = `<strong>Tilaaja:</strong> ${f.t || '---'}<br><strong>Varasto:</strong> ${f.v || '---'}<br><strong>Osoite:</strong> ${f.o}, ${f.p} ${f.k}<br><strong>Lisätiedot:</strong> ${f.l || '---'}`;
    items.innerHTML = "";
    Object.values(cart).forEach(i => {
        items.innerHTML += `<div style="padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
            <div><b>${i.code}</b> - ${i.name}</div>
            <div style="font-weight:bold; font-size:16px;">${i.qty} kpl</div>
        </div>`;
    });
    document.getElementById("fullCartModal").style.display = "flex";
}

function renderPkgs() {
    const div = document.getElementById("pkg-buttons"); div.innerHTML = "";
    Object.keys(asennusPaketit).forEach(name => {
        div.innerHTML += `<button style="padding:10px 15px; background:var(--hw-blue); color:white; border:none; border-radius:8px; cursor:pointer;" onclick="openPkgModal('${name}')">${name}</button>`;
    });
}

function openPkgModal(name) {
    const items = document.getElementById("pkgModalItems"); items.innerHTML = "";
    document.getElementById("pkgModalTitle").innerText = name;
    currentPkgItems = JSON.parse(JSON.stringify(asennusPaketit[name]));
    currentPkgItems.forEach((item, idx) => {
        let n = findNameByCode(item.code);
        items.innerHTML += `<div style="display:flex; align-items:center; padding:12px 10px; border-bottom:1px solid #eee;">
            <div style="flex-grow: 1; padding-right:15px;">
                <b style="font-size:13px;">${item.code}</b><br>
                <span style="font-size:13px; color:#555;">${n}</span>
            </div>
            <div class="qty-area" style="width: auto; margin: 0; justify-content: flex-end; display: flex;">
                <button class="qty-btn" onclick="updatePkgItemQty(${idx},-1)">-</button>
                <input class="qty-input" value="${item.qty}" readonly style="width: 35px; text-align: center; margin: 0 5px;">
                <button class="qty-btn" onclick="updatePkgItemQty(${idx},1)">+</button>
            </div>
        </div>`;
    });
    document.getElementById("pkgModal").style.display = "flex";
}

function updatePkgItemQty(idx, d) {
    currentPkgItems[idx].qty += d;
    if(currentPkgItems[idx].qty < 0) currentPkgItems[idx].qty = 0;
    document.querySelectorAll("#pkgModalItems .qty-input")[idx].value = currentPkgItems[idx].qty;
}

function confirmPkgToCart() {
    currentPkgItems.forEach(i => {
        if(i.qty > 0) updateQty(i.code, findNameByCode(i.code), i.qty, true);
    });
    document.getElementById("pkgModal").style.display = "none";
}

function openRelatedPopup(parentCode) {
    const content = document.getElementById("relatedContent"); content.innerHTML = "";
    relatedItems[parentCode].forEach(relCode => {
        let relName = findNameByCode(relCode);
        content.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;"><div><b>${relCode}</b><br>${relName}</div><button onclick="updateQty('${relCode}', '${relName}', 1, true)" style="background:var(--hw-green); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Lisää</button></div>`;
    });
    document.getElementById("relatedOverlay").style.display = "flex";
}

async function openBigImg(code, name) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = code + " - " + name;
    const linksDiv = document.getElementById("guideLinks");
    linksDiv.innerHTML = "Etsitään ohjeita...";
    const tags = ["", "_tekniset tiedot", "_Asennusvaatimukset", "_Esite", "_Manual", "_Menu", "_Varaosat", "_englanti", "_suomi", "_ohje"];
    let found = 0;
    for (let t of tags) {
        let url = `ohjeet/${code}${t}.pdf`;
        try {
            const res = await fetch(url, { method: 'HEAD' });
            if (res.ok) {
                if(found === 0) linksDiv.innerHTML = "";
                let a = document.createElement("a"); a.href = url; a.target = "_blank"; a.style = "display:block; margin:5px 0; color:#004593; font-weight:bold;";
                let label = t ? t.replace("_", "").toUpperCase() : "YLEISOHJE";
                a.innerText = `📄 ${label}`; linksDiv.appendChild(a); found++;
            }
        } catch (e) {}
    }
    if(found === 0) linksDiv.innerHTML = "<small style='color:#999'>Ei löytyneitä ohjeita.</small>";
    document.getElementById("imgModal").style.display = "flex";
}

function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let group = document.createElement("div"); group.className = "nav-group";
        let main = document.createElement("div"); main.className = "nav-main-cat";
        main.innerHTML = `${c.name} <span>▾</span>`;
        main.onclick = () => group.classList.toggle('active');
        group.appendChild(main);
        let subList = document.createElement("div"); subList.className = "nav-sub-list";
        c.subs.forEach(s => {
            let item = document.createElement("div"); item.className = "nav-sub-item";
            item.innerText = "- " + s;
            item.onclick = () => { 
                document.getElementById("cat-" + s.replace(/\s+/g, '-').toLowerCase())?.scrollIntoView({behavior:"smooth"});
                if(window.innerWidth < 900) toggleSidebar('nav-sidebar');
            };
            subList.appendChild(item);
        });
        group.appendChild(subList); nav.appendChild(group);
    });
}

function doAdminLogin() { 
    if(document.getElementById("adminUser").value === "admin" && document.getElementById("adminPass").value === "hartwall") { 
        isAdmin = true; document.getElementById("adminLoginPopup").style.display="none"; document.getElementById("adminSection").style.display="flex"; render(); 
    } else { alert("Virhe!"); }
}

function saveStockStatus() {
    const c = document.getElementById("adminCode").value.trim();
    if(!c) return alert("Anna koodi!");
    const koodirivi = `${c};${document.getElementById("adminOutOfStock").checked};${document.getElementById("adminHide").checked};${document.getElementById("adminETA").value}`;
    window.location.href = `mailto:tomi.eskola@hartwall.fi?subject=Varastopaivitys&body=${encodeURIComponent(koodirivi)}`;
}

function finalSubmit() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value, o: document.getElementById("f_osoite").value, p: document.getElementById("f_postinro").value, k: document.getElementById("f_paikka").value, tapa: document.getElementById("f_tapa").value, l: document.getElementById("f_lisatiedot").value, puut: document.getElementById("f_puuttuvat").value };
    if(!f.t || !f.v || !f.o || !f.p || !f.k || !f.tapa) return alert("Täytä pakolliset tiedot!");
    let body = `Tilaaja: ${f.t}\nVarasto: ${f.v}\nToimitustapa: ${f.tapa}\nOsoite: ${f.o}, ${f.p} ${f.k}\n\nLisätiedot: ${f.l}\n\nTuotteet:\n`;
    Object.values(cart).forEach(i => { body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`; });
    if(f.puut) body += `\nPuuttuvat tuotteet:\n${f.puut}`;
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Tilaus - ${f.t}&body=${encodeURIComponent(body)}`;
}
</script>
