<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hartwall Varaosatilaus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { 
    --hw-blue: #004593; --hw-dark: #002d62; --hw-green: #28a745; 
    --hw-bg: #f8fafc; --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --sidebar-w: 280px; 
}

body { font-family: 'Inter', sans-serif; margin: 0; background: var(--hw-bg); color: #1e293b; }

/* LOGIN & ADMIN */
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--hw-blue); display:flex; justify-content:center; align-items:center; z-index:100000; }
#adminLoginPopup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:100001; }
.login-box { background:white; padding:40px; border-radius:20px; width:340px; text-align:center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.login-box input { width:100%; padding:14px; margin-bottom:15px; border:1px solid #e2e8f0; border-radius:10px; box-sizing:border-box; font-size: 16px; }

/* LAYOUT */
.app-container { display: flex; min-height: 100vh; }
.nav-sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #e2e8f0; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.nav-header { background: var(--hw-dark); color: white; padding: 25px 20px; font-weight: bold; font-size: 18px; text-align: center; }
.nav-item { border-bottom: 1px solid #f1f5f9; }
.nav-main-cat { padding: 15px 20px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; background: #fff; }
.nav-sub-list { display: none; background: #f8fafc; padding-bottom: 10px; }
.nav-item.active .nav-sub-list { display: block; }
.nav-sub-item { padding: 8px 35px; font-size: 13px; cursor: pointer; color: #64748b; }
.nav-sub-item:hover { color: var(--hw-blue); font-weight: 600; }

.main-content { flex: 1; padding: 30px; min-width: 0; }

/* KATEGORIAOTSIKKO */
.category-title { 
    grid-column: 1 / -1; 
    background: var(--hw-blue); 
    color: white; 
    padding: 12px 20px; 
    border-radius: 10px; 
    font-weight: bold; 
    margin: 40px 0 20px 0;
    box-shadow: var(--shadow);
}

/* TUOTEKORTIT (GRID) */
#main-list { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
    gap: 25px; 
}

.product-card { 
    background: white; 
    border-radius: 16px; 
    padding: 20px; 
    box-shadow: var(--shadow); 
    display: flex; 
    flex-direction: column; 
    transition: transform 0.2s, border-color 0.2s; 
    border: 2px solid transparent;
    position: relative;
}
.product-card:hover { transform: translateY(-5px); border-color: var(--hw-blue); }
.product-card.out { background: #f0f0f0; opacity: 0.7; pointer-events: none; filter: grayscale(1); }

.card-img-wrap { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; cursor: zoom-in; }
.card-img { max-width: 100%; max-height: 100%; object-fit: contain; }

.card-info { flex-grow: 1; text-align: center; margin-bottom: 15px; }
.card-name { font-weight: 700; font-size: 14px; display: block; height: 40px; overflow: hidden; color: var(--hw-dark); line-height: 1.3; }
.card-code { color: #64748b; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }

.add-btn { 
    width: 100%; padding: 12px; border: none; border-radius: 10px; 
    background: var(--hw-blue); color: white; font-weight: bold; 
    cursor: pointer; transition: 0.3s;
}
.add-btn.in-cart { background: var(--hw-green); }

/* OSTOSKORI SIVUPALKKI */
#cart-sidebar { display: none; position: fixed; right: 0; top: 0; height: 100%; width: 360px; background: white; z-index: 100002; box-shadow: -10px 0 30px rgba(0,0,0,0.2); flex-direction: column; }
.cart-header-area { padding: 25px; background: var(--hw-dark); color: white; }
#basket-items { flex-grow: 1; overflow-y: auto; padding: 20px; }
.cart-footer { padding: 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; }

/* MUUT ELEMENTIT */
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 25px; border-radius: 50px; font-weight: 600; display: none; z-index: 100005; }
#btnTop { position: fixed; bottom: 100px; right: 32px; width: 50px; height: 50px; border-radius: 50%; background: var(--hw-blue); color: white; border: none; cursor: pointer; display: none; z-index: 9999; font-size: 20px; }
#fab-cart { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; border-radius: 50%; background: var(--hw-green); color: white; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4); cursor: pointer; z-index: 10000; }
#fab-count { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; display: flex; justify-content: center; align-items: center; font-weight: bold; }

/* MODALIT */
#imgModal, #pkgModal, #relatedOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100010; justify-content:center; align-items:center; }
.modal-content { background:white; padding:30px; border-radius:20px; width:700px; max-width:90%; max-height:85vh; overflow-y:auto; position: relative; }

#adminSection { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2d3748; color: white; padding: 15px; z-index: 100020; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; }
</style>
</head>
<body>

<div id="loginOverlay"><div class="login-box"><h2>Hartwall Varaosat</h2><input id="uField" placeholder="Käyttäjätunnus"><input id="pField" type="password" placeholder="Salasana"><button onclick="doAppLogin()" style="width:100%; padding:14px; background:var(--hw-blue); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">KIRJAUDU SISÄÄN</button><p id="loginError" style="color:red; display:none; margin-top:10px;">Kirjautuminen epäonnistui.</p></div></div>
<div id="adminLoginPopup" style="display:none;"><div class="login-box"><h3>Ylläpito</h3><input id="adminUser" placeholder="Tunnus"><input id="adminPass" type="password" placeholder="Salasana"><button onclick="doAdminLogin()" style="width:100%; padding:12px; background:var(--hw-dark); color:white; border:none; border-radius:6px; cursor:pointer;">KIRJAUDU</button></div></div>

<div id="toast">Tuote lisätty! 🛒</div>
<button id="btnTop" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</button>

<div id="fab-cart" onclick="toggleSidebar('cart-sidebar')">
    <span>🛒</span><div id="fab-count">0</div>
</div>

<div id="appWrapper" style="display:none;">
    <div class="app-container">
        <nav class="nav-sidebar"><div class="nav-header">VALIKKO</div><div id="dynamic-nav"></div></nav>
        <main class="main-content">
            <div class="form-section">
                <div class="form-grid">
                    <input id="f_tilaaja" placeholder="Tilaaja *" required oninput="updateCartHeader()">
                    <input id="f_varasto" placeholder="Varastonumero *" required oninput="updateCartHeader()">
                    <input id="f_pvm" type="date" required>
                    <input id="f_tapa" placeholder="Toimitustapa *" required>
                    <input id="f_osoite" placeholder="Osoite *" required>
                    <input id="f_postinro" placeholder="Postinumero *" required>
                    <input id="f_paikka" placeholder="Paikkakunta *" required>
                    <div class="full-width"><textarea id="f_lisatiedot" rows="2" placeholder="Lisätiedot tilaukseen..."></textarea></div>
                    <div class="full-width"><textarea id="f_puuttuvat" rows="2" placeholder="Listalta puuttuvat tuotteet (Koodi, Nimi, Määrä)..."></textarea></div>
                </div>
            </div>

            <input id="filter" style="width:100%; padding:18px 25px; border-radius:50px; border:2px solid #e2e8f0; font-size:16px; margin: 20px 0;" placeholder="Hae varaosia..." oninput="render(this.value)">
            
            <div style="background:#fff9c4; padding:20px; border-radius:12px; border:1px solid #fbc02d; margin-bottom:30px;">
                <div style="font-weight:bold; margin-bottom:10px; color:var(--hw-blue);">VALMIIT ASENNUSPAKETIT</div>
                <div id="pkg-buttons" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
            </div>
            <div id="main-list"></div>
        </main>
        
        <aside id="cart-sidebar">
            <div style="display:flex; flex-direction:column; height:100%;">
                <div class="cart-header-area">
                    <div style="display:flex; justify-content:space-between;"><h3>Ostoskori</h3><span onclick="toggleSidebar('cart-sidebar')" style="cursor:pointer; font-size:30px;">&times;</span></div>
                    <div id="cart-user-info" style="font-size:12px; margin-top:10px; opacity:0.8;">Täytä tilaajatiedot...</div>
                </div>
                <div id="basket-items"></div>
                <div class="cart-footer">
                    <button onclick="finalSubmit()" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">LÄHETÄ TILAUS</button>
                    <div onclick="document.getElementById('adminLoginPopup').style.display='flex'" style="text-align:center; margin-top:15px; color:#94a3b8; font-size:11px; cursor:pointer;">YLLÄPITO</div>
                </div>
            </div>
        </aside>
    </div>
</div>

<div id="imgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><span style="position:absolute; top:15px; right:20px; cursor:pointer; font-size:25px;" onclick="document.getElementById('imgModal').style.display='none'">&times;</span><h3 id="imgModalTitle" style="color:var(--hw-blue)"></h3><img id="bigImg" style="width:100%; border-radius:15px; margin-bottom:20px;"><div id="guideLinks"></div></div></div>
<div id="pkgModal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content"><h3 id="pkgModalTitle" style="color:var(--hw-blue)"></h3><div id="pkgModalItems"></div><button id="addPkgBtn" style="width:100%; padding:15px; background:var(--hw-green); color:white; border:none; border-radius:12px; font-weight:bold; margin-top:20px; cursor:pointer;">LISÄÄ KAIKKI KORIIN</button></div></div>
<div id="relatedOverlay" onclick="if(event.target==this)this.style.display='none'"><div class="modal-content" style="width:400px;"><h3>Suositellut lisäosat</h3><div id="relatedContent"></div></div></div>

<div id="adminSection">
    <input id="adminCode" placeholder="Koodi">
    <label><input type="checkbox" id="adminOutOfStock"> LOPPU</label>
    <label><input type="checkbox" id="adminHide"> PIILOTA</label>
    <input id="adminETA" placeholder="ETA">
    <button onclick="sendAdminEmail()" style="padding:10px; background:var(--hw-blue); color:white; border:none; border-radius:5px; cursor:pointer;">LÄHETÄ PÄIVITYS</button>
    <button onclick="document.getElementById('adminSection').style.display='none'" style="color:red; background:none; border:none; cursor:pointer;">X</button>
</div>

<script>
let allData = {}; let cart = {}; let categories = []; let stockStatus = {}; 
let autoGuideStatus = {}; let allowedUsers = {}; let asennusPaketit = {}; let relatedItems = {}; 
let currentPkgItems = []; let isAdmin = false;

const KEYWORDS = ["tekniset tiedot", "Asennusvaatimukset", "Esite", "Manual", "Menu", "Varaosat", "englanti", "suomi", "ohje"];

window.onscroll = () => { document.getElementById("btnTop").style.display = window.scrollY > 400 ? "block" : "none"; };

// 1. KÄYTTÄJÄHALLINTA
async function loadUsers() {
    try {
        const res = await fetch("käyttäjät.txt");
        if(res.ok) {
            const t = await res.text();
            t.split("\n").forEach(l => { const p = l.trim().split(/\s+/); if(p.length >= 2) allowedUsers[p[0].toLowerCase()] = p[p.length - 1]; });
        }
    } catch(e) {}
}
loadUsers();

function doAppLogin() {
    const u = document.getElementById("uField").value.trim().toLowerCase();
    const p = document.getElementById("pField").value.trim();
    if (allowedUsers[u] && allowedUsers[u] === p) {
        document.getElementById("loginOverlay").style.display="none";
        document.getElementById("appWrapper").style.display="block";
        document.getElementById("f_pvm").valueAsDate = new Date();
        loadFiles();
    } else { document.getElementById("loginError").style.display="block"; }
}

function doAdminLogin() {
    const u = document.getElementById("adminUser").value.trim();
    const p = document.getElementById("adminPass").value.trim();
    if (u === "admin" && p === "hartwall") {
        isAdmin = true;
        document.getElementById("adminLoginPopup").style.display = "none";
        document.getElementById("adminSection").style.display = "flex";
        render();
    } else { alert("Virhe!"); }
}

// 2. TUOTTEIDEN RENDERÖINTI (KORTTINÄKYMÄ)
function getProductName(code) {
    for (let cat in allData) {
        let p = allData[cat].find(x => x.code === code);
        if (p) return p.name;
    }
    return "";
}

function render(filter = "") {
    const list = document.getElementById("main-list"); list.innerHTML = "";
    categories.forEach(c => {
        c.subs.forEach(sub => {
            let prods = allData[sub] || [];
            let filt = prods.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.code.toLowerCase().includes(filter.toLowerCase()));
            if (filt.length === 0) return;
            
            list.innerHTML += `<div class="category-title" id="head-${sub.replace(/\s+/g, '')}">${sub}</div>`;
            
            filt.forEach(p => {
                let s = stockStatus[p.code] || { outOfStock: false, hidden: false };
                if(s.hidden && !isAdmin) return;
                
                const inCart = cart[p.code] ? 'in-cart' : '';
                const btnText = cart[p.code] ? `KORISSA (${cart[p.code].qty})` : 'LISÄÄ KORIIN';
                
                list.innerHTML += `
                    <div class="product-card ${s.outOfStock ? 'out' : ''}">
                        <div class="card-img-wrap" onclick="openBigImg('${p.code}')">
                            <img class="card-img" src="images/${p.code}.png" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                        </div>
                        <div class="card-info">
                            <span class="card-name">${p.name} <span id="icon-${p.code}" style="display:none">📄</span></span>
                            <span class="card-code">${p.code}</span>
                        </div>
                        <button class="add-btn ${inCart}" onclick="updateQty('${p.code}','${p.name}', 1)">${btnText}</button>
                    </div>`;
                
                checkGuideExists(p.code);
            });
        });
    });
}

// 3. OSTOSKORI JA TOIMINNOT
function updateQty(code, name, delta, skipPopup = false) {
    if(!name || name === "") name = getProductName(code) || "Varaosa " + code;
    if(!cart[code]) cart[code] = { code, name, qty: 0 };
    cart[code].qty += delta;
    if(cart[code].qty <= 0) delete cart[code];
    
    if(delta > 0) {
        const toast = document.getElementById("toast");
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", 2000);
        if(relatedItems[code] && !skipPopup) openRelatedPopup(code);
    }
    renderCart(); render(document.getElementById("filter").value);
}

function renderCart() {
    const div = document.getElementById("basket-items"); div.innerHTML = "";
    let total = 0;
    Object.values(cart).forEach(i => {
        total += i.qty;
        div.innerHTML += `<div style="padding:12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:12px;"><b>${i.code}</b><br>${i.name}</div>
            <div style="display:flex; align-items:center; gap:8px;"><button onclick="updateQty('${i.code}','',-1,true)">-</button><b>${i.qty}</b><button onclick="updateQty('${i.code}','',1,true)">+</button></div>
        </div>`;
    });
    document.getElementById("fab-count").innerText = total;
}

// 4. TIEDOSTOJEN LATAUS
async function loadFiles() {
    try {
        const [r1, r2, r3, r4, r5] = await Promise.all([
            fetch("data.txt"), fetch("kategoriat.txt"), fetch("varastotilanne.txt"), 
            fetch("suositukset.txt"), fetch("asennuspaketit.txt")
        ]);

        if(r1.ok) {
            const t = await r1.text(); let cur = null;
            t.split("\n").forEach(line => {
                let s = line.trim(); if(!s) return;
                if(!/^\d/.test(s.split(" ")[0]) && !s.includes("V0") && !s.includes("T0")) { cur = s; allData[cur] = []; }
                else if(cur) { 
                    const code = s.split(" ")[0];
                    allData[cur].push({code: code, name: s.substring(code.length).trim()}); 
                }
            });
        }
        if(r2.ok) {
            const t = await r2.text(); let curM = null;
            t.split("\n").forEach(l => {
                let s = l.trim(); if(!s) return;
                if(l.startsWith("-")) { if(curM) curM.subs.push(s.substring(1)); }
                else { curM = {name: s, subs: []}; categories.push(curM); }
            });
        }
        if(r3.ok) {
            const t = await r3.text();
            t.split("\n").forEach(l => { const p = l.trim().split(";"); if(p.length >= 4) stockStatus[p[0]] = { outOfStock: p[1] === "true", hidden: p[2] === "true", eta: p[3] }; });
        }
        if(r4.ok) {
            const t = await r4.text(); let parent = null;
            t.split("\n").forEach(l => {
                const s = l.trim(); if(!s) return; const p = s.split(/\s+/);
                if(p.length===1) { parent = p[0]; relatedItems[parent]=[]; }
                else if(parent) relatedItems[parent].push({code:p[0], qty:parseInt(p[1])||1});
            });
        }
        if(r5.ok) {
            const t = await r5.text(); let name = null;
            t.split("\n").forEach(l => {
                const s = l.trim(); if(!s) return; const p = s.split(/\s+/);
                if(p.length>=2 && /\d/.test(p[p.length-1])) {
                    if(name) asennusPaketit[name].push({code:p[0], qty:parseInt(p[p.length-1])||1});
                } else { name = s; asennusPaketit[name]=[]; }
            });
        }
        renderNav(); renderPkgs(); render();
    } catch(e) {}
}

// 5. APUFUNKTIOT
async function checkGuideExists(code) {
    if(autoGuideStatus[code]) return;
    const tests = [ `${code}.pdf`, `${code}.PDF` ];
    KEYWORDS.forEach(k => tests.push(`${code}_${k}.pdf`, `${code}_${k}.PDF`));
    for (let f of tests) {
        try {
            const res = await fetch(`ohjeet/${f}`, { method: 'HEAD' });
            if (res.ok) {
                autoGuideStatus[code] = true;
                const icon = document.getElementById(`icon-${code}`);
                if(icon) icon.style.display = 'inline';
                break;
            }
        } catch (e) {}
    }
}

async function openBigImg(code) {
    document.getElementById("bigImg").src = `images/${code}.png`;
    document.getElementById("imgModalTitle").innerText = `${code} - ${getProductName(code) || 'Varaosa'}`;
    const linksDiv = document.getElementById("guideLinks");
    linksDiv.innerHTML = "Etsitään ohjeita...";
    document.getElementById("imgModal").style.display = "flex";
    let html = ""; const tests = [ `${code}.pdf`, `${code}.PDF` ];
    KEYWORDS.forEach(k => tests.push(`${code}_${k}.pdf`, `${code}_${k}.PDF`));
    for (let f of tests) {
        try {
            const res = await fetch(`ohjeet/${f}`, { method: 'HEAD' });
            if (res.ok) {
                let label = f.includes("_") ? f.split("_")[1].split(".")[0].toUpperCase() : "OHJE";
                html += `<a style="display:block; padding:10px; background:#f1f5f9; color:#004593; margin-top:10px; text-decoration:none; border-radius:8px; font-weight:bold; border-left:4px solid #004593;" href="ohjeet/${f}" target="_blank">📄 AVAA ${label}</a>`;
            }
        } catch (e) {}
    }
    linksDiv.innerHTML = html || "<p style='color:#999'>Ei ohjeita.</p>";
}

function updateCartHeader() {
    const t = document.getElementById("f_tilaaja").value;
    const v = document.getElementById("f_varasto").value;
    document.getElementById("cart-user-info").innerText = (t || v) ? `${t} / ${v}` : "Täytä tilaajatiedot...";
}

function renderNav() {
    const nav = document.getElementById("dynamic-nav"); nav.innerHTML = "";
    categories.forEach(c => {
        let div = document.createElement("div"); div.className = "nav-item";
        div.innerHTML = `<div class="nav-main-cat" onclick="this.parentElement.classList.toggle('active')">${c.name} <span>▾</span></div>`;
        let subDiv = document.createElement("div"); subDiv.className = "nav-sub-list";
        c.subs.forEach(s => { 
            let item = document.createElement("div"); item.className = "nav-sub-item";
            item.innerText = s; item.onclick = () => {
                const el = document.getElementById("head-"+s.replace(/\s+/g, ''));
                if(el) el.scrollIntoView({behavior:"smooth"});
            };
            subDiv.appendChild(item);
        });
        div.appendChild(subDiv); nav.appendChild(div);
    });
}

function renderPkgs() {
    const div = document.getElementById("pkg-buttons"); div.innerHTML = "";
    Object.keys(asennusPaketit).forEach(n => {
        div.innerHTML += `<button style="padding:10px 15px; background:var(--hw-blue); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600;" onclick="openPkgModal('${n}')">${n}</button>`;
    });
}

function openPkgModal(n) {
    document.getElementById("pkgModalTitle").innerText = n;
    const itemsDiv = document.getElementById("pkgModalItems"); itemsDiv.innerHTML = "";
    currentPkgItems = asennusPaketit[n];
    currentPkgItems.forEach(i => {
        const nimi = getProductName(i.code) || "Nimike ei tiedossa";
        itemsDiv.innerHTML += `<div style="padding:8px 0; border-bottom:1px solid #eee;"><b>${i.code}</b> - ${nimi} (${i.qty} kpl)</div>`;
    });
    document.getElementById("addPkgBtn").onclick = confirmPkgToCart;
    document.getElementById("pkgModal").style.display = "flex";
}

function confirmPkgToCart() {
    currentPkgItems.forEach(i => { updateQty(i.code, getProductName(i.code), i.qty, true); });
    document.getElementById("pkgModal").style.display = "none";
}

function toggleSidebar(id) { 
    const el = document.getElementById(id); 
    el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
}

function openRelatedPopup(code) {
    const content = document.getElementById("relatedContent"); content.innerHTML = "";
    relatedItems[code].forEach(rel => {
        const n = getProductName(rel.code) || "Lisäosa " + rel.code;
        content.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;"><div><b>${rel.code}</b><br>${n}</div><button onclick="updateQty('${rel.code}','${n}',${rel.qty},true); this.innerText='Lisätty!';" style="background:var(--hw-green); color:white; border:none; padding:8px; border-radius:6px; cursor:pointer;">Lisää</button></div>`;
    });
    document.getElementById("relatedOverlay").style.display = "flex";
}

function sendAdminEmail() {
    const code = document.getElementById("adminCode").value.trim(); if(!code) return;
    const line = `${code};${document.getElementById("adminOutOfStock").checked};${document.getElementById("adminHide").checked};${document.getElementById("adminETA").value || ' '}`;
    window.location.href = `mailto:tomi.eskola@hartwall.fi?subject=Päivitys:${code}&body=${encodeURIComponent(line)}`;
}

function finalSubmit() {
    const f = { t: document.getElementById("f_tilaaja").value, v: document.getElementById("f_varasto").value, p: document.getElementById("f_pvm").value, tapa: document.getElementById("f_tapa").value, o: document.getElementById("f_osoite").value, n: document.getElementById("f_postinro").value, k: document.getElementById("f_paikka").value, l: document.getElementById("f_lisatiedot").value, puut: document.getElementById("f_puuttuvat").value };
    if(!f.t || !f.v || !f.p || !f.tapa || !f.o || !f.n || !f.k) return alert("Täytä kaikki pakolliset kentät (*)");
    let body = `Tilaaja: ${f.t}\nVarasto: ${f.v}\nPvm: ${f.p}\nToimitus: ${f.tapa}\nOsoite: ${f.o}, ${f.n} ${f.k}\n\nTuotteet:\n`;
    Object.values(cart).forEach(i => { body += `- ${i.qty} kpl : ${i.name} (${i.code})\n`; });
    if(f.puut) body += `\nLISTALTA PUUTTUVAT:\n${f.puut}\n`;
    if(f.l) body += `\nLISÄTIEDOT:\n${f.l}\n`;
    window.location.href = `mailto:lpvarasto@hartwall.fi?subject=Varaosatilaus - ${f.t}&body=${encodeURIComponent(body)}`;
}
</script>
</body>
